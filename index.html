    else if (OV_MODE === 'areas') h += renderAreas(active);
  }
  else if (VIEW === 'bereiche'){
    h += pageHead('Bereiche', 'Deine Lebensthemen — Notizen, Dokumente und Tools an einem Ort.');
    h += renderBereiche();
  }
  else if (VIEW === 'links'){
    h += pageHead('Links', 'Deine wichtigsten Webseiten — ein Tipp und du bist da.');
    h += renderLinks();
  }
  else if (VIEW === 'trash'){
    h += pageHead('Papierkorb', 'Gelöschte Aufgaben landen hier — nichts geht sofort verloren.');
    h += renderTrash();
  }
  else if (VIEW === 'settings'){
    h += pageHead('Einstellungen', 'Profil, Konto und Daten.');
    h += renderSettings();
  }

  contentEl.innerHTML = h;
  renderNav();
  bindRoot();
  if (VIEW === 'settings') updateSyncBadge();
  saveUIState();
}

/* Drag & Drop der Übungen innerhalb eines Trainingstages.
   Desktop: HTML5 draggable. Touch: Long-Press + Pointer-Move.
   Reihenfolge wird nach dem Ablegen in WORKOUT gespeichert (synct mit). */
function initExerciseDnD(){
  const list = $('exList');
  if (!list) return;
  const dayIdx = +list.dataset.dayidx;
  const items = Array.from(list.querySelectorAll('.sport-ex'));
  if (items.length < 2) return;

  let dragEl = null;

  function reorderData(){
    const order = Array.from(list.querySelectorAll('.sport-ex')).map(el => +el.dataset.exidx);
    const day = WORKOUT.days[dayIdx];
    const reordered = order.map(idx => day.exercises[idx]);
    day.exercises = reordered;
    pushUpsert(WORKOUT, false);
    render();
  }
  function afterEl(container, y){
    const els = Array.from(container.querySelectorAll('.sport-ex:not(.dragging)'));
    return els.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if (offset < 0 && offset > closest.offset) return { offset, element: child };
      return closest;
    }, { offset: -Infinity, element: null }).element;
  }

  items.forEach(item => {
    const grip = item.querySelector('.sport-ex-grip');

    // ── Desktop HTML5 Drag ──
    item.addEventListener('dragstart', e => {
      dragEl = item; item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      if (dragEl){ dragEl = null; reorderData(); }
    });

    // ── Touch: Drag startet SOFORT beim Berühren des Griffs ──
    if (grip){
      let dragging = false;
      const startDrag = () => {
        dragging = true;
        item.classList.add('dragging');
        document.body.classList.add('dnd-active');  // Textauswahl global aus
      };
      const endDrag = () => {
        if (dragging){
          dragging = false;
          item.classList.remove('dragging');
          document.body.classList.remove('dnd-active');
          reorderData();
        }
      };
      grip.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse') return;  // Maus nutzt HTML5-Drag
        e.preventDefault();                      // verhindert Textauswahl/Scroll sofort
        grip.setPointerCapture(e.pointerId);     // alle weiteren Events kommen zum Griff
        startDrag();
      });
      grip.addEventListener('pointermove', e => {
        if (!dragging) return;
        e.preventDefault();
        const after = afterEl(list, e.clientY);
        if (after == null) list.appendChild(item);
        else list.insertBefore(item, after);
      });
      grip.addEventListener('pointerup', e => {
        if (dragging){ try{ grip.releasePointerCapture(e.pointerId); }catch(_){} endDrag(); }
      });
      grip.addEventListener('pointercancel', endDrag);
    }
  });

  // Container-übergreifendes Verschieben (Desktop)
  list.addEventListener('dragover', e => {
    e.preventDefault();
    const after = afterEl(list, e.clientY);
    const dragging = list.querySelector('.dragging');
    if (!dragging) return;
    if (after == null) list.appendChild(dragging);
    else list.insertBefore(dragging, after);
  });
}

/* Hängt eigene hoch/runter-Pfeile an alle Number-Inputs — nur auf Desktop (Maus).
   Auf Touch passiert nichts, dort bleiben die nativen iOS-Felder. Idempotent. */
function enhanceNumberInputs(root){
  // Nur Desktop: Touch-Geräte haben keine matchMedia(hover)-Übereinstimmung
  if (!window.matchMedia || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const scope = root || document;
  scope.querySelectorAll('input[type="number"]').forEach(inp => {
    if (inp.dataset.stepped) return;          // schon umgebaut
    if (inp.closest('.num-wrap')) return;
    inp.dataset.stepped = '1';
    const wrap = document.createElement('span');
    wrap.className = 'num-wrap';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const steps = document.createElement('span');
    steps.className = 'num-steps';
    const up = document.createElement('button');   up.type='button'; up.tabIndex=-1; up.setAttribute('aria-label','erhöhen');
    up.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>';
    const dn = document.createElement('button');   dn.type='button'; dn.tabIndex=-1; dn.setAttribute('aria-label','verringern');
    dn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
    steps.appendChild(up); steps.appendChild(dn);
    wrap.appendChild(steps);
    const step = parseFloat(inp.step) || 1;
    const bump = dir => {
      const cur = parseFloat(inp.value);
      let base = isNaN(cur) ? (parseFloat(inp.placeholder) || 0) : cur;
      let next = base + dir*step;
      if (inp.min !== '' && next < parseFloat(inp.min)) next = parseFloat(inp.min);
      if (inp.max !== '' && next > parseFloat(inp.max)) next = parseFloat(inp.max);
      next = Math.round(next*100)/100;
      inp.value = next;
      inp.dispatchEvent(new Event('input', { bubbles:true }));
      inp.dispatchEvent(new Event('change', { bubbles:true }));
    };
    up.onclick = e => { e.preventDefault(); bump(1); };
    dn.onclick = e => { e.preventDefault(); bump(-1); };
  });
}

        <div class="logset-hint">Tipp: leer lassen übernimmt den grauen Vorschlag (z. B. wenn alle Sätze gleich sind).</div>

        <div class="field-card"><input class="cat-in-full" id="exRenameName" placeholder="Übungsname" value="${ex.exId?esc(exName(WORKOUT, ex.exId)):''}"></div>

      </div>
      ${isCardio ? `

      ` : `
        <div class="log-grid">

        </div>
        <div class="sec-lbl">Zielgewicht (optional)</div>
        <div class="field-card"><input class="cat-in-full" id="exZiel" type="number" inputmode="decimal" step="0.5" value="${ex.zielKg||''}" placeholder="kg — dein Progressionsziel"></div>
        <div class="sec-lbl">Notiz (optional)</div>
        <div class="field-card"><input class="cat-in-full" id="exNote" value="${esc(ex.note||'')}" placeholder="z. B. langsam, schonend"></div>
      `}
      <button class="sheet-save" id="exSave">${isNew?'Hinzufügen':'Speichern'}</button>
      ${!isNew?`<button class="del-btn" id="exDelete">${IC.trash}Übung aus diesem Tag entfernen</button>`:''}
    </div>
  </div>`;
  ov.onmousedown = e => { if (e.target === ov) closeSportSheet(); };
  document.body.appendChild(ov);
  sportSheetEl = ov;
  enhanceNumberInputs(ov);
  $('sportClose').onclick = closeSportSheet;

  // "Neue Übung" + "Name bearbeiten" ein-/ausblenden
  const sel = $('exSelect');
  const newWrap = $('exNewWrap');
  const renameWrap = $('exRenameWrap');
  const renameInput = $('exRenameName');
  sel.onchange = () => {
    const isNewSel = sel.value === '__new__';
    newWrap.style.display = isNewSel ? 'block' : 'none';
    renameWrap.style.display = (!isNewSel && sel.value) ? 'block' : 'none';
    // Rename-Feld mit aktuellem Namen der gewählten Übung füllen
    if (!isNewSel && sel.value){
      const e = WORKOUT.exDb.find(x => x.id === sel.value);
      if (e && renameInput) renameInput.value = e.name;
    }
  };

  $('exSave').onclick = () => {
    let exId = sel.value;
    // Neue Übung in die DB aufnehmen
    if (exId === '__new__'){
      const newName = ($('exNewName').value||'').trim();
      if (!newName){ showToast('Bitte Namen der neuen Übung eingeben'); return; }
      const exist = WORKOUT.exDb.find(e => e.name.toLowerCase() === newName.toLowerCase());
      if (exist){ exId = exist.id; }
      else { exId = uid(); WORKOUT.exDb.push({ id: exId, name: newName, muscle: isCardio?'Cardio':'' }); }
    } else if (exId){
      // Bestehende Übung: Name editierbar — Änderung in DB übernehmen
      const newName = (renameInput && renameInput.value || '').trim();
      if (newName){
        const dbEx = WORKOUT.exDb.find(e => e.id === exId);
        if (dbEx && dbEx.name !== newName){
          // Kollision mit anderer Übung gleichen Namens vermeiden
          const clash = WORKOUT.exDb.find(e => e.id !== exId && e.name.toLowerCase() === newName.toLowerCase());
          if (clash){ showToast('Eine andere Übung heißt schon so'); return; }
          dbEx.name = newName;
        }
      }
    }
    if (!exId){ showToast('Bitte eine Übung wählen'); return; }
    const reps = ($('exReps').value||'').trim() || '–';
    const note = ($('exNote').value||'').trim();
    const sets = isCardio ? 1 : (parseInt(($('exSets')||{}).value,10) || 1);
    const zielKg = isCardio ? null : (parseFloat(($('exZiel')||{}).value) || null);
    if (isNew){
      const obj = { id: uid(), exId, sets, reps, note, zielKg, log: [] };
      if (isCardio) obj.cardio = true;
      WORKOUT.days[i].exercises.push(obj);
    } else {
      ex.exId = exId; ex.sets = sets; ex.reps = reps; ex.note = note; ex.zielKg = zielKg;
    }
    pushUpsert(WORKOUT, false);
    closeSportSheet(); render();
  };
  const del = $('exDelete');
  if (del) del.onclick = () => {
    WORKOUT.days[i].exercises.splice(j, 1);
    pushUpsert(WORKOUT, false);
    closeSportSheet(); render();
  };
}

/* ── Sortier-Menü (kleines Popup) ── */
let sortMenuEl = null;
function closeSortMenu(){ if (sortMenuEl){ sortMenuEl.remove(); sortMenuEl = null; document.removeEventListener('click', closeSortMenu); } }
function buildSortMenu(menu){
  const dirArrow = dir => dir === 'asc' ? '↑' : '↓';
  const dirLabel = (crit, dir) => {
    if (crit === 'name')   return dir === 'asc' ? 'A → Z' : 'Z → A';
    if (crit === 'due')    return dir === 'asc' ? 'früh → spät' : 'spät → früh';
    if (crit === 'prio')   return dir === 'asc' ? 'hoch → niedrig' : 'niedrig → hoch';
    if (crit === 'effort') return dir === 'asc' ? 'kurz → lang' : 'lang → kurz';
    if (crit === 'created')return dir === 'asc' ? 'alt → neu' : 'neu → alt';
    return dir === 'asc' ? 'auf' : 'ab';
  };
  let h = `<div class="sort-sec-lbl">Sortieren nach</div>`;
  h += Object.entries(SORT_LABELS).map(([k,l]) =>
    `<button class="sort-opt ${SORT===k?'on':''}" data-sort="${k}"><span>${l}</span>${SORT===k?IC.check_sm:''}</button>` +
    (k==='smart' ? `<div class="sort-hint">${SORT_HINT}</div>` : '')
  ).join('');

  // Richtung + Sekundär nur, wenn nicht "Empfohlen"
  if (SORT !== 'smart'){
    h += `<div class="sort-div"></div>`;
    h += `<button class="sort-dir" data-sortdir="1"><span>Richtung</span><span class="sort-dir-val">${dirArrow(SORT_DIR)} ${dirLabel(SORT,SORT_DIR)}</span></button>`;
    h += `<div class="sort-div"></div>`;
    h += `<div class="sort-sec-lbl">Dann nach</div>`;
    const secondaryOpts = { none:'—', ...SORT_LABELS };
    delete secondaryOpts.smart;
    h += Object.entries(secondaryOpts).filter(([k]) => k===SORT? false : true).map(([k,l]) =>
      `<button class="sort-opt small ${SORT2===k?'on':''}" data-sort2="${k}"><span>${l}</span>${SORT2===k?IC.check_sm:''}</button>`
    ).join('');
    if (SORT2 !== 'none' && SORT2 !== SORT){
      h += `<button class="sort-dir small" data-sort2dir="1"><span>Richtung</span><span class="sort-dir-val">${dirArrow(SORT2_DIR)} ${dirLabel(SORT2,SORT2_DIR)}</span></button>`;
    }
    h += `<div class="sort-div"></div>`;
    h += `<button class="sort-done" data-sortdone="1">${IC.check_sm} Übernehmen</button>`;
  }
  menu.innerHTML = h;
  // Handler
  menu.querySelectorAll('[data-sort]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    SORT = b.dataset.sort;
    if (SORT === 'smart'){ SORT2 = 'none'; render(); closeSortMenu(); showToast('Sortierung: Empfohlen'); return; }
    // Anderes Kriterium gewählt: Menü offen lassen, damit man Richtung/2. Kriterium justieren kann
    refreshSortMenu(); render();
  });
  menu.querySelectorAll('[data-sort2]').forEach(b => b.onclick = e => { e.stopPropagation(); SORT2 = b.dataset.sort2; refreshSortMenu(); render(); });
  const dirBtn = menu.querySelector('[data-sortdir]');
  if (dirBtn) dirBtn.onclick = e => { e.stopPropagation(); SORT_DIR = SORT_DIR==='asc'?'desc':'asc'; refreshSortMenu(); render(); };
  const dir2Btn = menu.querySelector('[data-sort2dir]');
  if (dir2Btn) dir2Btn.onclick = e => { e.stopPropagation(); SORT2_DIR = SORT2_DIR==='asc'?'desc':'asc'; refreshSortMenu(); render(); };
  const doneBtn = menu.querySelector('[data-sortdone]');
  if (doneBtn) doneBtn.onclick = e => { e.stopPropagation(); closeSortMenu(); showToast(sortSummary()); };
}
/* Sortierung als kurzer, lesbarer Satz für die Bestätigung. */
function sortSummary(){
  if (SORT === 'smart') return 'Sortierung: Empfohlen';
  let s = `Sortiert nach ${SORT_LABELS[SORT]}`;
  if (SORT2 !== 'none' && SORT2 !== SORT) s += `, dann ${SORT_LABELS[SORT2]}`;
  return s;
}
function refreshSortMenu(){ if (sortMenuEl) buildSortMenu(sortMenuEl); }
function openSortMenu(anchor){
  closeSortMenu();
  const menu = document.createElement('div');
  menu.className = 'sort-menu';
  const r = anchor.getBoundingClientRect();
  menu.style.position = 'fixed';
  menu.style.top = (r.bottom + 6) + 'px';
  menu.style.right = (window.innerWidth - r.right) + 'px';
  document.body.appendChild(menu);
  sortMenuEl = menu;
  buildSortMenu(menu);
  setTimeout(() => document.addEventListener('click', closeSortMenu), 0);
}

function renderSheet(){
  const inner = $('sheetInner'); if (!inner) return;
  const d = DRAFT;
  const isRem = d.type === "reminder";
  const flagFill = c => '<svg viewBox="0 0 24 24" fill="'+c+'" stroke="'+c+'" stroke-width="2" style="width:12px;height:12px"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>';
  const flagOutline = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" style="width:12px;height:12px"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>';

  const dateLabel = () => { if (!d._dateOn) return "Ohne"; const di = dueInfo(d._dateVal, false); return di.label.replace(/,.*/,""); };
  const timeLabel = () => d._timeOn ? `${String(d._h).padStart(2,"0")}:${String(d._min).padStart(2,"0")}` : "Ohne";

  let h = `<div class="sheet-head">
    <button class="h-x" id="sheetClose">${IC.x}</button>
    <span class="h-title">${d.id ? "Bearbeiten" : (isRem ? "Neue Erinnerung" : "Neue Aufgabe")}</span>
    <button class="h-ok" id="sheetSave" ${!(d.text&&d.text.trim())?'disabled':''}>${IC.check}</button>
  </div><div class="sheet-body">`;

  // Typ-Switch
  h += `<div class="seg">
    <button class="${!isRem?'on':''}" data-type="task">${IC.checks}Aufgabe</button>
    <button class="${isRem?'on':''}" data-type="reminder">${IC.bell}Erinnerung</button>
  </div>`;

  // Titel + Notizen
  h += `<div class="field-card">
    <input class="t-input" id="sTitle" value="${esc(d.text)}" placeholder="${isRem?'Woran erinnern?':'Was ist zu tun?'}">
    <textarea class="n-input" id="sNotes" rows="1" placeholder="Notizen (optional)">${esc(d.notes)}</textarea>
  </div>`;

  // Datum & Zeit
  h += `<div class="sec-lbl">Datum &amp; Uhrzeit</div><div class="field-card">`;
  h += `<div class="row"><span class="r-ic">${IC.cal}</span><div class="r-lbl">Datum${d._dateOn?`<div class="r-sub">${dateLabel()}</div>`:''}</div><button class="tog ${d._dateOn?'on':''}" data-tog="date"><span class="knob"></span></button></div>`;
  if (d._dateOn && d._calOpen){
    h += `<div class="quickdays">`;
    [["Heute",0],["Morgen",1],["Übermorgen",2],["+1 Woche",7]].forEach(([lbl,off]) => {
      const dd = startOfDay(new Date()); dd.setDate(dd.getDate()+off);
      const on = startOfDay(new Date(d._dateVal)).getTime() === dd.getTime();
      h += `<button class="qd ${on?'on':''}" data-quickday="${off}">${lbl}</button>`;
    });
    h += `</div>`;
    h += calHTML();
  } else if (d._dateOn){
    // Datum kam automatisch (durch Uhrzeit/Wiederholung) — Kalender nicht aufdrängen, aber Öffnen anbieten
    h += `<button class="date-change" data-calshow="1">${IC.cal2 || IC.cal} Fällig: ${dateLabel()} · ändern</button>`;
  }
  h += `<div class="row"><span class="r-ic">${IC.clock}</span><div class="r-lbl">Uhrzeit${d._timeOn?`<div class="r-sub">${timeLabel()}</div>`:''}</div><button class="tog ${d._timeOn?'on':''}" data-tog="time"><span class="knob"></span></button></div>`;
  if (d._timeOn){
    h += `<div class="time-wheels"><div class="wheel-band"></div>`;
    h += wheelHTML('h', Array.from({length:24},(_,i)=>i), d._h);
    h += `<span class="wheel-colon">:</span>`;
    h += wheelHTML('min', Array.from({length:12},(_,i)=>i*5), d._min);
    h += `</div>`;
  }
  if (d._dateOn){
    h += `<div class="row"><span class="r-ic">${IC.bell}</span><div class="r-lbl">Benachrichtigen<div class="r-sub">Hinweis in DoNow, wenn fällig</div></div><button class="tog ${d.notify?'on':''}" data-tog="notify"><span class="knob"></span></button></div>`;
  }
  const repIsCustom = isCustomRepeat(d.repeat);
  const repSelKey = repIsCustom ? 'custom' : (d.repeat || 'none');
  const repValLabel = repIsCustom ? repeatLabel(d.repeat) : (REPEATS.find(r=>r[0]===repSelKey)||['','Nie'])[1];
  h += `<div class="row" style="flex-direction:column;align-items:stretch;gap:0">
    <div style="display:flex;align-items:center;gap:12px"><span class="r-ic">${IC.repeat}</span><div class="r-lbl">Wiederholen</div><span class="r-val">${repValLabel}</span></div>
    <div class="repeat-sel">${REPEATS.map(([k,l])=>`<button class="rep-chip ${repSelKey===k?'on':''}" data-repeat="${k}">${l}</button>`).join('')}</div>`;
  if (repSelKey === 'custom'){
    const n = d._repN || (repIsCustom ? d.repeat.n : 2);
    const unit = d._repUnit || (repIsCustom ? d.repeat.unit : 'day');
    h += `<div class="rep-custom">
      <span class="rep-custom-lbl">Alle</span>
      <input class="rep-custom-n" id="repN" type="number" min="1" max="365" value="${n}" inputmode="numeric">
      <div class="rep-unit-seg">
        <button class="rep-unit ${unit==='day'?'on':''}" data-repunit="day">Tage</button>
        <button class="rep-unit ${unit==='week'?'on':''}" data-repunit="week">Wochen</button>
      </div>
    </div>`;
  }
  h += `</div>`;
  h += `</div>`;

  if (!isRem){
    // Status
    h += `<div class="sec-lbl">Status</div><div class="field-card"><div class="status-grid">`;
    STATUSES.forEach(([k,l]) => {
      const c = STATUS_META[k] ? STATUS_META[k].c : (k==="erledigt" ? "var(--on)" : "var(--text)");
      const on = d.status === k;
      h += `<button class="status-btn" data-status="${k}" style="${on?`border-color:${c};color:${c};background:rgba(255,255,255,.04)`:''}"><span class="st-dot" style="background:${on?c:'var(--faint)'}"></span>${l}</button>`;
    });
    h += `</div></div>`;
    // Priorität
    h += `<div class="sec-lbl">Priorität</div><div class="field-card"><div class="prio-seg">`;
    [[0,"Ohne"],[3,"!"],[2,"!!"],[1,"!!!"]].forEach(([pv,l]) => {
      const on = d.priority === pv;
      const c = PRIO[pv].c;
      let style = '';
      if (on && pv!==0) style = `border-color:${c};color:${c};background:rgba(255,255,255,.04)`;
      else if (on) style = `color:var(--text);background:var(--bg)`;
      const icon = pv!==0 ? (on?flagFill(c):flagOutline) : '';
      h += `<button data-prio="${pv}" style="${style}">${icon}${l}</button>`;
    });
    h += `</div></div>`;

    // Aufwand (geschätzte Zeit)
    h += `<div class="sec-lbl">Aufwand</div><div class="field-card"><div class="effort-seg">`;
    EFFORTS.forEach(([val,l]) => {
      const on = (d.effort||"") === val;
      h += `<button data-effort="${val}" class="${on?'on':''}">${l}</button>`;
    });
    h += `</div></div>`;
  }
  h += `<div class="sec-lbl">Kategorie</div><div class="field-card"><div class="cat-wrap">
    <input class="cat-in-full" id="sCat" value="${esc(d.category||'')}" placeholder="z. B. Arbeit, Studium, Privat…">`;
  const cats = categoriesList();
  if (cats.length){
    h += `<div class="cat-chips">${cats.map(c=>`<button class="cat-chip ${d.category===c?'on':''}" data-cat="${esc(c)}">#${esc(c)}</button>`).join('')}</div>`;
  }
  h += `</div></div>`;

  // Teilschritte (nur Aufgabe)
  if (!isRem){
    h += `<div class="sec-lbl">Teilschritte</div><div class="field-card">`;
    d.subtasks.forEach((s,i) => {
      h += `<div class="sub-edit"><span class="scbox-s"></span><input data-subinput="${i}" value="${esc(s.text)}" placeholder="Teilschritt…"><button class="iconbtn del" data-subdel="${i}">${IC.x}</button></div>`;
    });
    h += `<button class="sub-add" id="subAdd">${IC.plus}Teilschritt hinzufügen</button>`;
    h += `</div>`;
  }

  if (d.id){
    h += `<button class="del-btn" id="sheetDel">${IC.trash2}Löschen</button>`;
  }

  h += `</div>`;
  inner.innerHTML = h;
  bindSheet();
}

function calHTML(){
  const m = new Date(DRAFT._calMonth);
  const today = startOfDay(new Date());
  const sel = DRAFT._dateVal ? startOfDay(new Date(DRAFT._dateVal)) : null;
  const y = m.getFullYear(), mo = m.getMonth();
  const firstWd = (new Date(y, mo, 1).getDay() + 6) % 7;
  const days = new Date(y, mo+1, 0).getDate();
  let h = `<div class="cal"><div class="cal-head"><button class="cal-nav" data-calnav="-1">${IC.chevLeft}</button><span class="cm">${MONTHS[mo]} ${y}</span><button class="cal-nav" data-calnav="1">${IC.chevRight}</button></div><div class="cal-grid">`;
  WD_CAL.forEach(w => h += `<div class="cal-wd">${w}</div>`);
  for (let i=0;i<firstWd;i++) h += `<div></div>`;
  for (let dnum=1;dnum<=days;dnum++){
    const date = startOfDay(new Date(y, mo, dnum));
    const isToday = date.getTime() === today.getTime();
    const isSel = sel && date.getTime() === sel.getTime();
    h += `<div class="cal-day ${isToday?'today':''} ${isSel?'sel':''}" data-calday="${date.toISOString()}">${dnum}</div>`;
  }
  h += `</div></div>`;
  return h;
}

function wheelHTML(name, values, value){
  let h = `<div class="wheel" data-wheel="${name}"><div class="wheel-pad"></div>`;
  values.forEach(v => h += `<div class="wheel-item ${v===value?'on':''}" data-wv="${v}">${String(v).padStart(2,"0")}</div>`);
  h += `<div class="wheel-pad"></div></div>`;
  return h;
}

function buildFromDraft(){
  const d = DRAFT;
  const isRem = d.type === "reminder";
  let due = null, hasTime = false;
  if (d._dateOn){
    const dt = new Date(d._dateVal);
    if (d._timeOn){ dt.setHours(d._h, d._min, 0, 0); hasTime = true; } else dt.setHours(0,0,0,0);
    due = dt.toISOString();
  }
  const eff = isRem ? (d.done ? "erledigt" : "offen") : d.status;
  const done = eff === "erledigt";
  // Individueller Turnus braucht ein Datum als Anker — ohne Datum verwerfen.
  let repeat = d.repeat;
  if (isCustomRepeat(repeat) && !due) repeat = "none";
  return {
    id: d.id, type: d.type, text: (d.text||'').trim(), notes: (d.notes||'').trim(),
    priority: d.priority, effort: d.effort || null, category: (d.category||'').trim() || null,
    due, hasTime, notify: d._dateOn ? d.notify : false, repeat,
    status: eff, done, completedAt: done ? (d.completedAt || Date.now()) : null,
    subtasks: isRem ? [] : (d.subtasks||[]).filter(s => (s.text||'').trim()),
    createdAt: d.createdAt
  };
}

function bindSheet(){
  $('sheetClose').onclick = closeSheet;
  $('sheetSave').onclick = () => { if (!(DRAFT.text&&DRAFT.text.trim())) return; saveTask(buildFromDraft()); closeSheet(); };

  const title = $('sTitle');
  title.oninput = () => { DRAFT.text = title.value; $('sheetSave').disabled = !title.value.trim(); };
  title.onkeydown = e => { if (e.key==='Enter' && title.value.trim()){ saveTask(buildFromDraft()); closeSheet(); } };
  const notes = $('sNotes');
  if (notes) notes.oninput = () => DRAFT.notes = notes.value;
  const cat = $('sCat');
  if (cat) cat.oninput = () => DRAFT.category = cat.value;

  document.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
    DRAFT.type = b.dataset.type;
    if (DRAFT.type === 'reminder'){ DRAFT._dateOn = true; DRAFT.notify = true; DRAFT.priority = 0; }
    renderSheet();
  });
  document.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => {
    const k = b.dataset.tog;
    if (k==='date'){
      DRAFT._dateOn = !DRAFT._dateOn;
      DRAFT._calOpen = DRAFT._dateOn;  // Datum-Toggle steuert Kalender direkt
      if (!DRAFT._dateOn){ DRAFT._timeOn=false; DRAFT.notify=false; }
    }
    if (k==='time'){ DRAFT._timeOn = !DRAFT._timeOn; if (DRAFT._timeOn && !DRAFT._dateOn) DRAFT._dateOn = true; }  // Datum an, Kalender NICHT aufdrängen
    if (k==='notify'){ DRAFT.notify = !DRAFT.notify; }
    renderSheet();
  });
  const calShow = document.querySelector('[data-calshow]');
  if (calShow) calShow.onclick = () => { DRAFT._calOpen = true; renderSheet(); };
  document.querySelectorAll('[data-quickday]').forEach(b => b.onclick = () => {
    const off = +b.dataset.quickday; const dd = startOfDay(new Date()); dd.setDate(dd.getDate()+off);
    DRAFT._dateVal = dd.toISOString(); DRAFT._calMonth = dd.toISOString(); renderSheet();
  });
  document.querySelectorAll('[data-calday]').forEach(b => b.onclick = () => { DRAFT._dateVal = b.dataset.calday; renderSheet(); });
  document.querySelectorAll('[data-calnav]').forEach(b => b.onclick = () => {
    const dir = +b.dataset.calnav; const m = new Date(DRAFT._calMonth); m.setMonth(m.getMonth()+dir); DRAFT._calMonth = m.toISOString(); renderSheet();
  });
  document.querySelectorAll('[data-repeat]').forEach(b => b.onclick = () => {
    const k = b.dataset.repeat;
    if (k === 'custom'){
      const n = DRAFT._repN || (isCustomRepeat(DRAFT.repeat) ? DRAFT.repeat.n : 2);
      const unit = DRAFT._repUnit || (isCustomRepeat(DRAFT.repeat) ? DRAFT.repeat.unit : 'day');
      DRAFT._repN = n; DRAFT._repUnit = unit;
      DRAFT.repeat = { n, unit };
      if (!DRAFT._dateOn){ DRAFT._dateOn = true; }  // braucht Datum als Anker — aber Kalender NICHT aufdrängen (heute wird automatisch genommen)
    } else {
      DRAFT.repeat = k;
    }
    renderSheet();
  });
  const repNEl = $('repN');
  if (repNEl) repNEl.oninput = () => {
    let n = parseInt(repNEl.value, 10);
    if (isNaN(n) || n < 1) n = 1; if (n > 365) n = 365;
    DRAFT._repN = n;
    DRAFT.repeat = { n, unit: DRAFT._repUnit || 'day' };
    const val = document.querySelector('.r-val');  // Label live aktualisieren ohne Re-Render (Fokus halten)
    if (val) val.textContent = repeatLabel(DRAFT.repeat);
  };
  document.querySelectorAll('[data-repunit]').forEach(b => b.onclick = () => {
    DRAFT._repUnit = b.dataset.repunit;
    DRAFT.repeat = { n: DRAFT._repN || 2, unit: DRAFT._repUnit };
    renderSheet();
  });
  document.querySelectorAll('[data-status]').forEach(b => b.onclick = () => { DRAFT.status = b.dataset.status; renderSheet(); });
  document.querySelectorAll('[data-prio]').forEach(b => b.onclick = () => { DRAFT.priority = +b.dataset.prio; renderSheet(); });
  document.querySelectorAll('[data-effort]').forEach(b => b.onclick = () => { DRAFT.effort = b.dataset.effort || null; renderSheet(); });
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { DRAFT.category = b.dataset.cat; renderSheet(); });

  // Teilschritte
  document.querySelectorAll('[data-subinput]').forEach(inp => inp.oninput = () => { DRAFT.subtasks[+inp.dataset.subinput].text = inp.value; });
  document.querySelectorAll('[data-subdel]').forEach(b => b.onclick = () => { DRAFT.subtasks.splice(+b.dataset.subdel,1); renderSheet(); });
  const sa = $('subAdd');
  if (sa) sa.onclick = () => { DRAFT.subtasks.push({ id:'s'+uid(), text:'', done:false }); renderSheet(); };

  // Wheels: Scroll-Snap → Wert übernehmen
  document.querySelectorAll('[data-wheel]').forEach(w => {
    const name = w.dataset.wheel;
    const ITEM = 40;
    const values = name==='h' ? Array.from({length:24},(_,i)=>i) : Array.from({length:12},(_,i)=>i*5);
    const cur = name==='h' ? DRAFT._h : DRAFT._min;
    const idx = values.indexOf(cur);
    if (idx >= 0) w.scrollTop = idx * ITEM;
    const applyFromScroll = () => {
      const i = Math.round(w.scrollTop / ITEM);
      const v = values[Math.max(0, Math.min(values.length-1, i))];
      if (name==='h') DRAFT._h = v; else DRAFT._min = v;
      w.querySelectorAll('.wheel-item').forEach(it => it.classList.toggle('on', +it.dataset.wv === v));
    };
    let tmr = null;
    w.onscroll = () => { clearTimeout(tmr); tmr = setTimeout(applyFromScroll, 90); };
    // Desktop: Mausrad pro Tick exakt EIN Schritt (verhindert das Überspringen)
    let wheelLock = false;
    w.addEventListener('wheel', e => {
      e.preventDefault();
      if (wheelLock) return;
      wheelLock = true;
      const dir = e.deltaY > 0 ? 1 : -1;
      const i = Math.round(w.scrollTop / ITEM);
      const next = Math.max(0, Math.min(values.length-1, i + dir));
      w.scrollTo({ top: next * ITEM, behavior: 'smooth' });
      setTimeout(() => { wheelLock = false; }, 110);
    }, { passive:false });
  });

  const del = $('sheetDel');
  if (del) del.onclick = () => removeTask(DRAFT.id);
}

/* ═══════════════ BOOT ═══════════════ */

function bindLogin(){
  $('authBtn').onclick = doAuth;
  $('toggleMode').onclick = () => setAuthMode(authMode === 'signup' ? 'login' : 'signup');
  $('pass').onkeydown = e => { if (e.key === 'Enter') doAuth(); };
  $('email').onkeydown = e => { if (e.key === 'Enter') $('pass').focus(); };

  // Config-Felder vorbefüllen
  $('cfgUrl').value = CFG.url;
  $('cfgKey').value = CFG.key;
  $('cfgSave').onclick = () => {
    const url = $('cfgUrl').value.trim().replace(/\/$/, '');
    const key = $('cfgKey').value.trim();
    if (!url || !key){ showLoginMsg('Bitte URL und Key eintragen.', 'err'); return; }
    CFG.url = url; CFG.key = key;
    if (initClient()){ showLoginMsg('Verbunden! Jetzt anmelden oder registrieren.', 'ok'); $('cfgBox').open = false; attachAuthListener(); }
    else showLoginMsg('Verbindung fehlgeschlagen – Daten prüfen.', 'err');
  };
}

let authListenerAttached = false;
function attachAuthListener(){
  if (!sb || authListenerAttached) return;
  authListenerAttached = true;
  sb.auth.onAuthStateChange((event, session) => {
    if (session && session.user){ onLoggedIn(session); }
    else if (event === 'SIGNED_OUT'){ USER = null; }
  });
}

async function boot(){
  bindLogin();
  setAuthMode('login');

  const ok = initClient();
  if (!ok){
    // Keine Verbindungsdaten → Login mit aufgeklapptem Config-Bereich
    $('boot').style.display = 'none';
    $('login').style.display = 'flex';
    $('cfgBox').open = true;
    showLoginMsg('Zum Start einmalig die Supabase-Verbindung einrichten (unten).');
    return;
  }

  attachAuthListener();
  // Bestehende Session?
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session){ onLoggedIn(data.session); return; }
  } catch(e){}

  $('boot').style.display = 'none';
  $('login').style.display = 'flex';
}


/* ═══════════════ PWA: Service Worker (eingebettet) ═══════════════
   Macht DoNow installierbar. Cached die App-Shell fürs Offline-Öffnen.
   Läuft nur über http(s); bei file:// wird es übersprungen. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const swCode = `
    const CACHE = 'donow-v1';
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch', e => {
      const url = e.request.url;
      // Supabase-/API-Anfragen NIE cachen (immer live), nur die App-Shell
      if (url.includes('supabase.co') || url.includes('supabase.in') || e.request.method !== 'GET') return;
      e.respondWith(
        caches.open(CACHE).then(cache =>
          cache.match(e.request).then(hit =>
            hit || fetch(e.request).then(resp => {
              try { if (resp && resp.status === 200 && (url.startsWith('http'))) cache.put(e.request, resp.clone()); } catch(_) {}
              return resp;
            }).catch(() => hit)
          )
        )
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  window.addEventListener('load', () => {
    navigator.serviceWorker.register(swUrl).catch(() => {});
  });
}

/* App-Zustand sichern, bevor iOS/Android die PWA in den Hintergrund schickt.
   Das ist der Schlüssel, damit man nach Rückkehr nicht auf der Übersicht landet. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && typeof saveUIState === 'function' && USER){
    saveUIState();
  }
});
window.addEventListener('pagehide', () => {
  if (typeof saveUIState === 'function' && USER) saveUIState();
});
// Scrollposition laufend (gedrosselt) mitschreiben, damit sie beim Verdrängen aktuell ist
let _scrollSaveTimer = null;
window.addEventListener('scroll', () => {
  if (!USER) return;
  if (_scrollSaveTimer) return;
  _scrollSaveTimer = setTimeout(() => { _scrollSaveTimer = null; saveUIState(); }, 400);
}, { passive:true });

document.addEventListener('DOMContentLoaded', boot);

/* Erinnerungs-Banner aktuell halten: prüft minütlich, ob neue Erinnerungen
   fällig wurden. Rendert nur neu, wenn man auf der Heute-Ansicht ist, kein
   Sheet offen ist und sich die Anzahl fälliger Erinnerungen geändert hat. */
let _lastRemCount = -1;
setInterval(() => {
  if (!USER) return;
  if (VIEW !== 'overview' || OV_MODE !== 'today') return;
  if (DRAFT) return;
  const active = TASKS.filter(t => !t.deletedAt);
  const n = dueReminders(active).length;
  if (n !== _lastRemCount){ _lastRemCount = n; render(); }
}, 60000);

</script>
