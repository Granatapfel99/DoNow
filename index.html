<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════
   DoNow — Standalone, Supabase-synchron
   ═══════════════════════════════════════════════════════════════════════ */

/* ---------- Konfiguration (lokal pro Gerät) ---------- */
const CFG = {
  get url(){ return localStorage.getItem('pilot.sb.url') || ''; },
  set url(v){ localStorage.setItem('pilot.sb.url', v); },
  get key(){ return localStorage.getItem('pilot.sb.key') || ''; },
  set key(v){ localStorage.setItem('pilot.sb.key', v); }
};

let sb = null;
function initClient(){
  if (CFG.url && CFG.key && window.supabase){
    try { sb = window.supabase.createClient(CFG.url, CFG.key); return true; } catch(e){ return false; }
  }
  return false;
}

/* ---------- Zustand ---------- */
let TASKS = [];          // aktive Aufgaben
let TRASH = [];          // archivierte
let LINKS = [];          // Shortcut-Sammlung (eigener Datensatz-Typ, _kind:"link")
let WORKOUT = null;      // Trainingsplan (eigener Datensatz, _kind:"workout", feste id "workout-plan")
let WEIGHTS = [];        // Gewichtseinträge (_kind:"weight")
/* ── Bereiche: das Herz von DoNow (Second Brain) ──
   Ein Bereich (_kind:"area") ist ein Lebensthema: Auto, Steuer, Sport, Studium…
   Jeder hat Tabs: Notizen, Dokumente, optional Tools (z.B. Sport-Trainingsplan).
   Notizen (_kind:"note") referenzieren den Bereich per areaId.
   Der Sport-Bereich ist fest (id "area-sport", hasTools), damit Trainingsplan etc. erhalten bleibt. */
let AREAS = [];          // Bereichs-Objekte {id, name, icon, hasTools}
let AREA_OPEN = null;    // offener Bereich (id) oder null (Bereichs-Übersicht)
let AREA_TAB = 'notes';  // Tab im offenen Bereich: 'notes' | 'docs' | 'tools'
let SPORT_TAB = 'plan';  // Sport-Tools-Unteransicht: 'plan' | 'gewicht' | 'essen'
let SPORT_DAY = null;    // aktuell geöffneter Trainingstag-Index oder null
let NUTRI_DAY = null;    // aktuell geöffneter Ernährungstag-Index oder null
let NOTES = [];          // Notizen (_kind:"note", referenzieren areaId)
let NOTE_OPEN = null;    // aktuell geöffnete Notiz-ID oder null
let DOC_FOLDER = null;   // offener Dokumente-Ordner (id) oder null (Wurzel)
const SPORT_AREA_ID = 'area-sport';   // feste ID des Sport-Bereichs
let NAME  = localStorage.getItem('pilot.name') || '';
let VIEW  = 'overview';  // Hauptnavigation: overview | sport | links | trash | settings
let USER  = null;
let openSubsState = {};  // id -> bool (Teilschritte aufgeklappt)
let AREA_FILTER = null;  // aktiver Bereichsfilter (Kategorie) oder null
let OV_MODE = 'today';   // Übersicht-Filter: 'today' | 'all' | 'matrix' | 'areas'
let SEARCH = '';         // Suchtext in der Übersicht
/* Sortierung. 'smart' (Empfohlen) ignoriert Richtung und Sekundär-Kriterium.
   Bei den übrigen: SORT_DIR 'asc'|'desc', SORT2 optionales zweites Kriterium ('none' = keins). */
let SORT = 'smart';      // smart | due | prio | effort | name | created
let SORT_DIR = 'asc';    // asc | desc (nur für nicht-smart)
let SORT2 = 'none';      // zweites Kriterium oder 'none'
let SORT2_DIR = 'asc';
/* Umfangreicher To-Do-Filter (kombinierbar). null/leer = inaktiv. */
let FILTER = {
  prio: [],         // Array von 1|2|3 (Mehrfachauswahl)
  cat: [],          // Array von Kategorienamen
  due: 'any',       // 'any' | 'overdue' | 'today' | 'week' | 'nodate'
  fav: false,       // nur Favoriten
};
let FILTER_OPEN = false;   // Filter-Panel sichtbar?
let toastTimer = null;

/* ---------- Konstanten ---------- */
const DAYS = ["sonntag","montag","dienstag","mittwoch","donnerstag","freitag","samstag"];
const DAYS_SHORT = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const WD_LONG = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const WD_CAL = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const WD_CAL_FULL = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

/* Zentrale Übungs-Datenbank (Punkt 7): eine Übung = eine Identität.
   Plan, Log und Statistik referenzieren Übungen per exId, nicht per Name.
   So heißt "Beinstrecker" überall gleich. Nutzer können eigene Übungen anlegen
   (bekommen dann auch eine feste ID), die in WORKOUT.exDb gespeichert werden. */
const EXERCISE_SEED = [
  // Oberkörper
  { id:'ex_bench',     name:'Bankdrücken (Langhantel)', muscle:'Brust' },
  { id:'ex_pullup',    name:'Klimmzüge / Latzug',       muscle:'Rücken' },
  { id:'ex_ohp',       name:'Schulterdrücken (Kurzhantel)', muscle:'Schultern' },
  { id:'ex_row_cable', name:'Rudern (Kabel)',           muscle:'Rücken' },
  { id:'ex_curl',      name:'Bizeps-Curls',             muscle:'Arme' },
  { id:'ex_tri_push',  name:'Trizeps-Drücken (Kabel)',  muscle:'Arme' },
  { id:'ex_incline',   name:'Schrägbankdrücken',        muscle:'Brust' },
  { id:'ex_row_bb',    name:'Rudern vorgebeugt',        muscle:'Rücken' },
  { id:'ex_lat_raise', name:'Seitheben',                muscle:'Schultern' },
  // Unterkörper
  { id:'ex_legpress',  name:'Beinpresse',               muscle:'Beine' },
  { id:'ex_rdl',       name:'Rumänisches Kreuzheben',   muscle:'Beine' },
  { id:'ex_leg_curl',  name:'Beinbeuger',               muscle:'Beine' },
  { id:'ex_leg_ext',   name:'Beinstrecker',             muscle:'Beine' },
  { id:'ex_calf',      name:'Wadenheben',               muscle:'Beine' },
  { id:'ex_squat',     name:'Kniebeuge',                muscle:'Beine' },
  // Rumpf
  { id:'ex_plank',     name:'Plank',                    muscle:'Rumpf' },
  { id:'ex_crunch',    name:'Crunch',                   muscle:'Rumpf' },
  // Cardio
  { id:'ex_bike',      name:'Radfahren (Ergometer)',    muscle:'Cardio' },
];

/* Optimaler 5-Tage-Plan. Übungen referenzieren exId aus der DB.
   Kraft: sets + reps + optional zielKg (Progressionsziel).
   Cardio: sets=1, reps=Dauer-Text, ziel="Puls ~130 bpm" (editierbar in Notiz). */
function defaultWorkoutPlan(){
  const k = (exId, sets, reps, note, zielKg) => ({ id: uid(), exId, sets, reps, note: note||'', zielKg: zielKg||null, log: [] });
  const c = (exId, reps, note) => ({ id: uid(), exId, sets: 1, reps, note: note||'', cardio: true, log: [] });
  return {
    _kind: 'workout', id: 'workout-plan',
    exDb: EXERCISE_SEED.slice(),   // editierbare Kopie der Übungs-DB
    days: [
      { wd:'Mo', type:'kraft', title:'Oberkörper', exercises:[
        k('ex_bench', 4, '8–10'),
        k('ex_pullup', 4, '8–12'),
        k('ex_ohp', 3, '10–12'),
        k('ex_row_cable', 3, '10–12'),
        k('ex_curl', 3, '12–15'),
        k('ex_tri_push', 3, '12–15'),
      ]},
      { wd:'Di', type:'cardio', title:'Cardio – Rad', exercises:[
        c('ex_bike', '30–40 min', 'Ziel: Puls ~130 bpm (locker), gelenkschonend'),
      ]},
      { wd:'Mi', type:'kraft', title:'Unterkörper', exercises:[
        k('ex_legpress', 4, '10–12', 'Meniskus-schonend statt tiefe Kniebeuge'),
        k('ex_rdl', 3, '8–10'),
        k('ex_leg_curl', 3, '12–15'),
        k('ex_leg_ext', 3, '12–15'),
        k('ex_calf', 4, '15–20'),
        k('ex_plank', 3, '45–60 sek'),
      ]},
      { wd:'Do', type:'cardio', title:'Cardio – Rad', exercises:[
        c('ex_bike', '30–40 min', 'Ziel: Puls ~130 bpm, aktive Erholung'),
      ]},
      { wd:'Fr', type:'kraft', title:'Ganzkörper', exercises:[
        k('ex_squat', 3, '8–10', 'kontrolliert, sauber'),
        k('ex_incline', 3, '8–10'),
        k('ex_row_bb', 3, '10–12'),
        k('ex_lat_raise', 3, '12–15'),
        k('ex_crunch', 3, '15–20'),
      ]},
      { wd:'Sa', type:'rest', title:'Ruhetag', exercises:[] },
      { wd:'So', type:'rest', title:'Ruhetag', exercises:[] },
    ]
  };
}

/* Leerer Trainingsplan: 7 Tage, aber ohne Übungen — zum selbst Befüllen.
   Behält die Übungs-DB (Auswahl), damit man Übungen wählen kann. */
function emptyWorkoutPlan(){
  return {
    _kind: 'workout', id: 'workout-plan',
    exDb: EXERCISE_SEED.slice(),
    days: [
      { wd:'Mo', type:'kraft',  title:'Tag 1', exercises:[] },
      { wd:'Di', type:'kraft',  title:'Tag 2', exercises:[] },
      { wd:'Mi', type:'kraft',  title:'Tag 3', exercises:[] },
      { wd:'Do', type:'kraft',  title:'Tag 4', exercises:[] },
      { wd:'Fr', type:'kraft',  title:'Tag 5', exercises:[] },
      { wd:'Sa', type:'rest',   title:'Ruhetag', exercises:[] },
      { wd:'So', type:'rest',   title:'Ruhetag', exercises:[] },
    ]
  };
}
/* Leere Ernährung: keine Rezepte/Wochenplan, nur Standard-Ziele — zum selbst Befüllen. */
function emptyNutrition(){
  return {
    _nutver: 3,
    goals: { kcal:2300, protein:170, fat:70 },
    proteinToday: {},
    recipes: {},
    week: [ {a:null,b:null},{a:null,b:null},{a:null,b:null},{a:null,b:null},{a:null,b:null},{a:null,b:null},{a:null,b:null} ],
    chosen: {},
  };
}
/* Reset-Funktionen — leeren NUR die Daten des aktuell eingeloggten Nutzers
   (in dessen eigener Datenbank). Beim Verschenken kann ein Kumpel so bei null starten. */
function resetWorkout(){
  const fresh = emptyWorkoutPlan();
  // exDb des aktuellen Plans behalten (eigene Übungen bleiben wählbar)
  if (WORKOUT && WORKOUT.exDb) fresh.exDb = WORKOUT.exDb;
  // Ernährung NICHT anfassen (getrennte Knöpfe) — rüberretten
  if (WORKOUT && WORKOUT.nutrition) fresh.nutrition = WORKOUT.nutrition;
  WORKOUT = fresh;
  pushUpsert(WORKOUT, false);
}
function resetNutrition(){
  if (!WORKOUT) WORKOUT = emptyWorkoutPlan();
  WORKOUT.nutrition = emptyNutrition();
  pushUpsert(WORKOUT, false);
}
function clearWorkoutDay(i){
  if (WORKOUT && WORKOUT.days[i]){
    WORKOUT.days[i].exercises = [];
    pushUpsert(WORKOUT, false);
  }
}
/* Übungsnamen aus der DB holen (mit Fallback). */
function exName(workout, exId){
  const db = (workout && workout.exDb) || EXERCISE_SEED;
  const e = db.find(x => x.id === exId);
  return e ? e.name : '—';
}
/* Hebt einen evtl. alten Plan (Übungen mit name statt exId) sanft auf die
   neue Struktur. Idempotent — schon migrierte Pläne bleiben unverändert. */
function migrateWorkout(w){
  if (!w || !w.days) return defaultWorkoutPlan();
  if (!w.exDb) w.exDb = EXERCISE_SEED.slice();
  let changed = false;
  w.days.forEach(day => {
    (day.exercises||[]).forEach(ex => {
      if (!ex.exId && ex.name){
        // Passenden DB-Eintrag finden oder neu anlegen
        let found = w.exDb.find(e => e.name.toLowerCase() === ex.name.toLowerCase());
        if (!found){ found = { id: uid(), name: ex.name, muscle: day.type==='cardio'?'Cardio':'' }; w.exDb.push(found); }
        ex.exId = found.id;
        delete ex.name;
        if (ex.zielKg === undefined) ex.zielKg = null;
        changed = true;
      }
    });
  });
  if (changed) pushUpsert(w, false);
  return w;
}

/* Sorgt dafür, dass das Bereiche-Modell konsistent ist:
   1. Sport-Bereich existiert (fest, mit Tools)
   2. Alte 'notearea'-Datensätze → neue 'area'-Objekte
   3. Alte Notizen mit note.area (Name) → note.areaId (ID)
   Idempotent. */
function migrateAreas(legacyNoteAreas){
  let changed = false;
  // 1. Sport-Bereich sicherstellen
  if (!AREAS.find(a => a.id === SPORT_AREA_ID)){
    const sportArea = { _kind:'area', id:SPORT_AREA_ID, name:'Sport', icon:'dumbbell', hasTools:true, createdAt:Date.now() };
    AREAS.push(sportArea);
    pushUpsert(sportArea, false);
    changed = true;
  }
  // 2. Alte notearea → area
  (legacyNoteAreas||[]).forEach(na => {
    if (!na.name) return;
    let area = AREAS.find(a => a.name.toLowerCase() === na.name.toLowerCase());
    if (!area){
      area = { _kind:'area', id:'area-'+uid(), name:na.name, icon:'note', hasTools:false, createdAt:na.createdAt||Date.now() };
      AREAS.push(area);
      pushUpsert(area, false);
    }
    // alten notearea-Datensatz entfernen
    cloudDelete(na.id).catch(()=>{});
    changed = true;
  });
  // 3. Notizen mit Namens-Referenz auf areaId umstellen
  NOTES.forEach(n => {
    if (!n.areaId && n.area){
      const area = AREAS.find(a => a.name.toLowerCase() === n.area.toLowerCase());
      if (area){ n.areaId = area.id; delete n.area; pushUpsert(n, false); changed = true; }
    }
  });
  return changed;
}
/* ── Ernährung: Ziele, Rezepte, Wochenpläne ──
   Philosophie wie Trainingsplan: einfach, schnell, sofort nutzbar. KEIN Kalorientracker.
   Werte sind grobe Orientierung (editierbar), KEINE ärztliche Vorgabe.
   Rezepte: schnelle, günstige Studentenküche aus der Lebensmittelbasis. */
function defaultNutrition(){
  // Rezepte mit ID, Werten (ca.), Zutaten und max. 5 Schritten.
  // Fokus: günstig (Studentenbudget), alltagstauglich, hoher Protein-Anteil.
  // €-Einordnung grob: € = sehr günstig, €€ = mittel.
  const recipes = {
    // ── Frühstück / Basis ──
    'oats':      { name:'Protein Oats',         kcal:600, protein:40, cost:'€',  ing:['80 g Haferflocken','300 ml Milch','1 Scoop Proteinpulver','1 Banane'], steps:['Haferflocken mit Milch 3 Min köcheln','Vom Herd, Proteinpulver einrühren','Banane in Scheiben drauf'] },
    'quarkbowl': { name:'Quark Bowl',           kcal:450, protein:55, cost:'€',  ing:['250 g Magerquark','100 g Skyr','TK-Beeren','30 g Haferflocken','etwas Honig'], steps:['Quark & Skyr verrühren','Mit etwas Milch cremig rühren','Beeren, Haferflocken & Honig toppen'] },

    'skyrshake': { name:'Skyr-Shake to go',     kcal:350, protein:40, cost:'€',  ing:['300 g Skyr','1 Banane','30 g Haferflocken','Wasser'], steps:['Alles in den Mixer','Mit Wasser auf Wunschkonsistenz','Mitnehmen'] },
    // ── Hauptgerichte (günstige Proteinquellen) ──
    'chickrice': { name:'Chicken Rice Bowl',    kcal:700, protein:55, cost:'€€', ing:['150 g Hähnchenbrust','80 g Reis (roh)','Paprika','TK-Brokkoli','Sojasauce, Gewürze'], steps:['Reis kochen','Hähnchen würfeln, scharf anbraten','Gemüse zugeben, 5 Min braten','Mit Sojasauce abschmecken'] },
    'hackpfanne':{ name:'Hackpfanne',           kcal:700, protein:45, cost:'€€', ing:['150 g Hackfleisch (mager)','250 g Kartoffeln','Zwiebel','Paprika','Gewürze'], steps:['Kartoffeln würfeln, vorkochen','Hack krümelig anbraten','Zwiebel + Paprika zugeben','Kartoffeln untermischen, würzen'] },
    'tunapasta': { name:'Thunfisch-Pasta',      kcal:650, protein:50, cost:'€',  ing:['100 g Vollkornnudeln','1 Dose Thunfisch','100 g körniger Frischkäse','Tomaten','Kräuter'], steps:['Nudeln kochen','Thunfisch, Frischkäse & Tomaten mischen','Mit heißen Nudeln vermengen, würzen'] },
    'lentilcurry':{ name:'Linsen-Curry',        kcal:600, protein:30, cost:'€',  ing:['100 g rote Linsen','200 ml passierte Tomaten','Zwiebel','Reis','Gewürze (Curry)'], steps:['Zwiebel anbraten','Linsen + Tomaten + Wasser zugeben','15 Min köcheln','Mit Reis servieren'] },
    'beanrice':  { name:'Bohnen-Reis-Pfanne',   kcal:600, protein:28, cost:'€',  ing:['1 Dose Kidneybohnen','80 g Reis (roh)','Paprika','Zwiebel','Gewürze (Paprika, Kreuzkümmel)'], steps:['Reis kochen','Zwiebel + Paprika anbraten','Bohnen zugeben, würzen','Mit Reis mischen'] },
    'eggspot':   { name:'Bauernfrühstück',      kcal:600, protein:30, cost:'€',  ing:['4 Eier','250 g Kartoffeln','Zwiebel','etwas Öl','Gewürze'], steps:['Kartoffeln in Scheiben braten','Zwiebel zugeben','Eier verquirlt darüber, stocken lassen'] },
    'quarkpot':  { name:'Herzhafter Quark + Kartoffeln', kcal:500, protein:45, cost:'€', ing:['250 g Magerquark','300 g Pellkartoffeln','Schnittlauch','Leinöl','Salz'], steps:['Kartoffeln kochen','Quark mit Schnittlauch, Leinöl & Salz anrühren','Zusammen servieren'] },
    // ── Snack ──
    'shake':     { name:'Proteinshake',         kcal:170, protein:30, cost:'€',  ing:['30 g Proteinpulver','300 ml Wasser oder Milch'], steps:['Pulver + Flüssigkeit in den Shaker','Kräftig schütteln'] },
    'skyrsnack': { name:'Skyr + Beeren',        kcal:200, protein:20, cost:'€',  ing:['200 g Skyr','TK-Beeren','etwas Honig'], steps:['Skyr in eine Schüssel','Beeren & Honig drauf'] },
  };
  const dayPlan = (a, b) => ({ a, b });
  const A = (fr,mi,ab,sn) => ({ label:'Option A', meals:{ frueh:fr, mittag:mi, abend:ab, snack:sn } });
  const B = (fr,mi,ab,sn) => ({ label:'Option B', meals:{ frueh:fr, mittag:mi, abend:ab, snack:sn } });
  return {
    _nutver: 3,   // Versionsnummer: erlaubt sauberes Aktualisieren des Pools
    goals: { kcal:2300, protein:170, fat:70 },   // kalibrierter Startwert (Mifflin-St-Jeor, moderates Defizit)
    proteinToday: {},
    recipes,
    week: [
      dayPlan(A('oats','chickrice','quarkpot','shake'),       B('quarkbowl','hackpfanne','eggspot','skyrsnack')),    // Mo
      dayPlan(A('quarkbowl','lentilcurry','tunapasta','shake'),B('oats','chickrice','eggsbread','skyrsnack')),       // Di
      dayPlan(A('eggsbread','hackpfanne','quarkbowl','shake'), B('oats','beanrice','tunapasta','skyrsnack')),        // Mi
      dayPlan(A('oats','chickrice','lentilcurry','shake'),    B('quarkbowl','hackpfanne','eggspot','skyrsnack')),    // Do
      dayPlan(A('skyrshake','tunapasta','eggspot','shake'),   B('oats','chickrice','quarkpot','skyrsnack')),         // Fr
      dayPlan(A('oats','beanrice','hackpfanne','shake'),      B('quarkbowl','tunapasta','eggspot','skyrsnack')),     // Sa
      dayPlan(A('quarkbowl','chickrice','lentilcurry','shake'),B('oats','hackpfanne','eggsbread','skyrsnack')),      // So
    ],
    chosen: {},
  };
}
const MEAL_LBL = { frueh:'Frühstück', mittag:'Mittag', abend:'Abend', snack:'Snack' };
const SPORT_TYPE_LBL = { kraft:'Kraft', cardio:'Cardio', rest:'Ruhetag' };

const REPEATS = [["none","Nie"],["daily","Täglich"],["weekly","Wöchentlich"],["monthly","Monatlich"],["custom","Individuell…"]];
const REPEAT_LBL = { daily:"täglich", weekly:"wöchentlich", monthly:"monatlich" };

/* repeat kann sein: ein String ("none"|"daily"|"weekly"|"monthly")
   ODER ein Objekt {n, unit} mit unit "day"|"week" für individuellen Turnus.
   Diese Helfer verstehen beide Formen. */
function isCustomRepeat(r){ return r && typeof r === 'object' && r.n; }
function hasRepeat(r){ return r && r !== 'none' && (typeof r === 'string' || isCustomRepeat(r)); }
function repeatLabel(r){
  if (!hasRepeat(r)) return '';
  if (typeof r === 'string') return REPEAT_LBL[r] || '';
  const n = r.n, unit = r.unit;
  if (unit === 'day')  return n === 1 ? 'täglich' : `alle ${n} Tage`;
  if (unit === 'week') return n === 1 ? 'wöchentlich' : `alle ${n} Wochen`;
  return '';
}
/* Rückt ein Datum um genau einen Turnus-Schritt vor. */
function advanceDate(date, r){
  const d = new Date(date);
  if (typeof r === 'string'){
    if (r === 'daily')   d.setDate(d.getDate() + 1);
    else if (r === 'weekly')  d.setDate(d.getDate() + 7);
    else if (r === 'monthly') d.setMonth(d.getMonth() + 1);
  } else if (isCustomRepeat(r)){
    if (r.unit === 'day')  d.setDate(d.getDate() + r.n);
    else if (r.unit === 'week') d.setDate(d.getDate() + r.n * 7);
  }
  return d;
}

/* ---------- Datums-Helfer ---------- */
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const possessive = n => !n.trim() ? "" : (/[sßxz]$/i.test(n.trim()) ? n.trim()+"'" : n.trim()+"s");
const statusOf = t => t.status || (t.done ? "erledigt" : "offen");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function timeAgo(ts){
  if (!ts) return "gerade eben";
  const diff = Math.floor((Date.now() - ts)/1000);
  if (diff < 60) return "gerade eben";
  if (diff < 3600) return `vor ${Math.floor(diff/60)} Min.`;
  if (diff < 86400) return `vor ${Math.floor(diff/3600)} Std.`;
  const d = Math.floor(diff/86400);
  return d===1 ? "gestern" : `vor ${d} Tagen`;
}

function parseInput(raw){
  let text = raw.trim();
  let priority = 0, category = null, due = null, hasTime = false;
  const ex = text.match(/(!{1,3})(?=\s|$)/);
  if (ex){ priority = ex[1].length === 3 ? 1 : ex[1].length === 2 ? 2 : 3; text = text.replace(ex[0],"").trim(); }
  if (!priority && /\bdringend\b/i.test(text)){ priority = 1; }
  else if (!priority && /\bwichtig\b/i.test(text)){ priority = 2; }
  const cat = text.match(/#([\wäöüß-]+)/i);
  if (cat){ category = cat[1]; text = text.replace(cat[0],"").trim(); }
  let hh = null, mm = 0;
  const tColon = text.match(/\b(\d{1,2}):(\d{2})\b(\s*uhr)?/i);
  const tUhr = text.match(/\b(\d{1,2})\s*uhr\b/i);
  if (tColon){ hh = +tColon[1]; mm = +tColon[2]; text = text.replace(tColon[0],"").trim(); }
  else if (tUhr){ hh = +tUhr[1]; text = text.replace(tUhr[0],"").trim(); }
  const now = new Date();
  let dueDate = null;
  if (/\bübermorgen\b/i.test(text)){ dueDate = startOfDay(now); dueDate.setDate(dueDate.getDate()+2); text = text.replace(/übermorgen/i,"").trim(); }
  else if (/\bmorgen\b/i.test(text)){ dueDate = startOfDay(now); dueDate.setDate(dueDate.getDate()+1); text = text.replace(/morgen/i,"").trim(); }
  else if (/\bheute\b/i.test(text)){ dueDate = startOfDay(now); text = text.replace(/heute/i,"").trim(); }
  else {
    const inDays = text.match(/\bin\s+(\d{1,2})\s+tagen?\b/i);
    const ddmm = text.match(/\b(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?\b/);
    let matchedDay = null;
    for (let i=0;i<DAYS.length;i++){ if (new RegExp(`\\b${DAYS[i]}\\b`,"i").test(text)){ matchedDay = i; break; } }
    if (inDays){ dueDate = startOfDay(now); dueDate.setDate(dueDate.getDate()+ +inDays[1]); text = text.replace(inDays[0],"").trim(); }
    else if (ddmm){ const y = ddmm[3] ? (ddmm[3].length===2 ? 2000+ +ddmm[3] : +ddmm[3]) : now.getFullYear();
      dueDate = startOfDay(new Date(y, +ddmm[2]-1, +ddmm[1])); text = text.replace(ddmm[0],"").trim(); }
    else if (matchedDay !== null){ dueDate = startOfDay(now);
      let diff = (matchedDay - now.getDay() + 7) % 7; if (diff === 0) diff = 7;
      dueDate.setDate(dueDate.getDate()+diff); text = text.replace(new RegExp(DAYS[matchedDay],"i"),"").trim(); }
  }
  if (hh !== null){ if (!dueDate) dueDate = startOfDay(now); dueDate.setHours(hh, mm, 0, 0); hasTime = true; }
  if (dueDate) due = dueDate.toISOString();
  text = text.replace(/\s{2,}/g," ").replace(/\s+(um|am|den)$/i,"").trim();
  return { text: text || raw.trim(), priority, category, due, hasTime };
}

/* Liefert aktive Aufgaben mit aktivem Benachrichtigen-Toggle, deren
   Fälligkeit erreicht ist. Mit Uhrzeit: exakter Zeitpunkt erreicht.
   Ohne Uhrzeit: Tag ist heute oder bereits vergangen. */
function dueReminders(active){
  const now = Date.now();
  const todayStart = startOfDay(new Date()).getTime();
  return active.filter(t => {
    if (!t.notify || !t.due || t.done) return false;
    const due = new Date(t.due).getTime();
    if (t.hasTime) return due <= now;
    return startOfDay(new Date(t.due)).getTime() <= todayStart;
  }).sort((a,b) => new Date(a.due) - new Date(b.due));
}

function dueInfo(iso, hasTime){
  if (!iso) return null;
  const d = new Date(iso), today = startOfDay(new Date()), day = startOfDay(d);
  const diff = Math.round((day - today)/86400000);
  const time = hasTime ? `, ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}` : "";
  let label;
  if (diff < 0) label = `${Math.abs(diff)}d überfällig`;
  else if (diff === 0) label = `Heute${time}`;
  else if (diff === 1) label = `Morgen${time}`;
  else if (diff <= 6) label = `${DAYS_SHORT[d.getDay()]}${time}`;
  else label = `${d.getDate()}.${d.getMonth()+1}.${time}`;
  return { label, overdue: diff < 0, diff };
}

/* Smart-Ranking: kleinerer Wert = weiter oben.
   Stufen (Gewichtung nach Wunsch):
   1. Überfällig  2. Heute+Uhrzeit  3. Heute ohne Uhrzeit  4. Hohe Prio
   5. Quick Wins (<15 min)  6. Mittlere Prio  7. Rest.
   on_hold/info werden nach unten geschoben (kein akuter Handlungsbedarf). */
function score(t){
  const st = statusOf(t);
  const di = t.due ? dueInfo(t.due, t.hasTime) : null;
  const overdue = di && di.diff < 0;
  const today = di && di.diff === 0;
  const soon = di && di.diff > 0;

  let band;            // Hauptstufe (0 = ganz oben)
  if (overdue)                          band = 0;
  else if (today && t.hasTime)          band = 1;
  else if (today)                       band = 2;
  else if (t.priority === 1)            band = 3;   // P1
  else if (t.effort && +t.effort <= 15) band = 4;   // Quick Win
  else if (t.priority === 2)            band = 5;   // P2
  else if (soon)                        band = 6;   // datiert, später
  else if (t.priority === 3)            band = 7;   // P3
  else                                  band = 8;   // ohne alles

  // Feinsortierung innerhalb der Stufe
  let tie = 0;
  if (di){
    // näher dran = weiter oben; bei Uhrzeit die Minute des Tages mitnehmen
    tie = di.diff * 1440;
    if (t.hasTime){ const d = new Date(t.due); tie += d.getHours()*60 + d.getMinutes(); }
  } else {
    tie = 99999;
  }
  // Priorität als leichter Zusatz-Tiebreaker (P1 vor P3 vor ohne)
  const prioTie = t.priority ? t.priority : 9;

  let s = band * 1e7 + (tie + 100000) * 10 + prioTie;

  // Pausiert / reine Info ganz nach hinten (aber über Erledigtem, das eh rausgefiltert ist)
  if (st === "on_hold") s += 5e8;
  if (st === "info")    s += 9e8;
  return s;
}

function uid(){ return Date.now()+""+Math.random().toString(36).slice(2,6); }

/* ═══════════════ CLOUD-SYNC (Supabase) ═══════════════
   Eine Tabelle 'tasks': { id, user_id, data (jsonb), trashed }.
   Aktive Aufgaben: trashed=false. Papierkorb: trashed=true.
   user_id wird serverseitig per RLS gesetzt/geprüft. */

async function cloudLoadAll(){
  const { data, error } = await sb.from('tasks').select('id,data,trashed');
  if (error) throw error;
  const active = [], trash = [], links = [], weights = [], notes = [], areas = [], legacyNoteAreas = [];
  let workout = null;
  (data||[]).forEach(row => {
    const obj = row.data || {};
    obj.id = row.id;
    if (obj._kind === 'link'){ links.push(obj); return; }     // Links separat
    if (obj._kind === 'workout'){ workout = obj; return; }     // Trainingsplan
    if (obj._kind === 'weight'){ weights.push(obj); return; }  // Gewichtseinträge
    if (obj._kind === 'note'){ notes.push(obj); return; }      // Notizen
    if (obj._kind === 'area'){ areas.push(obj); return; }      // Bereiche (neu)
    if (obj._kind === 'notearea'){ legacyNoteAreas.push(obj); return; } // alte Notiz-Bereiche (Migration)
    if (row.trashed) trash.push(obj); else active.push(obj);
  });
  trash.sort((a,b) => (b.deletedAt||0) - (a.deletedAt||0));
  links.sort((a,b) => (b.fav?1:0)-(a.fav?1:0) || (a.createdAt||0)-(b.createdAt||0));
  weights.sort((a,b) => (a.date||0) - (b.date||0));
  notes.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
  return { active, trash, links, workout, weights, notes, areas, legacyNoteAreas };
}
async function cloudUpsert(obj, trashed){
  const { id, ...rest } = obj;
  const { error } = await sb.from('tasks').upsert({ id, data: { ...rest, id }, trashed: !!trashed, updated_at: new Date().toISOString() });
  if (error) throw error;
}
async function cloudDelete(id){
  const { error } = await sb.from('tasks').delete().eq('id', id);
  if (error) throw error;
}

/* Schreib-Warteschlange: hält UI flüssig, fängt Offline-Fälle ab */
let syncErr = false;
async function pushUpsert(obj, trashed){
  if (!sb || !USER) return;
  try { await cloudUpsert(obj, trashed); syncErr = false; }
  catch(e){ syncErr = true; console.warn('Sync-Fehler (upsert):', e.message); }
  updateSyncBadge();
}
async function pushDelete(id){
  if (!sb || !USER) return;
  try { await cloudDelete(id); syncErr = false; }
  catch(e){ syncErr = true; console.warn('Sync-Fehler (delete):', e.message); }
  updateSyncBadge();
}

function updateSyncBadge(){

/* Alter aus Geburtsdatum. */
function ageFromBirth(){
  const b = getBirth(); if (!b) return null;
  const d = new Date(b); if (isNaN(d)) return null;
  const now = new Date();
  let a = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < d.getDate())) a--;
  return a > 0 && a < 120 ? a : null;
}
/* Geschätzte maximale Herzfrequenz (Tanaka-Formel: 208 − 0,7 × Alter). */
function maxHR(){ const a = ageFromBirth(); return a ? Math.round(208 - 0.7*a) : null; }

  if (!sb){ showLoginMsg('Erst Verbindung einrichten (unten).', 'err'); $('cfgBox').open = true; return; }

function addQuick(raw){
  const p = parseInput(raw);
  const t = { id:uid(), type:"task", text:p.text, notes:"", priority:p.priority, category:p.category,
    status:"offen", due:p.due, hasTime:p.hasTime, notify:false, repeat:"none", done:false,
    completedAt:null, subtasks:[], createdAt:Date.now() };
  TASKS.push(t); render(); pushUpsert(t, false);
}

function saveTask(draft){
  const existing = TASKS.find(x => x.id === draft.id);
  if (existing){ Object.assign(existing, draft); render(); pushUpsert(existing, false); }
  else { const t = { ...draft, id: draft.id || uid(), createdAt: Date.now() }; TASKS.push(t); render(); pushUpsert(t, false); }
}

function toggleDone(id){
  const t = TASKS.find(x => x.id === id); if (!t) return;

  // Wiederkehrende Aufgabe mit Datum: nicht abhaken, sondern aufs nächste Datum rücken.
  if (!t.done && hasRepeat(t.repeat) && t.due){
    let next = advanceDate(new Date(t.due), t.repeat);
    // Falls das nächste Datum schon vorbei ist, so lange weiterrücken bis es heute/künftig liegt.
    const todayStart = startOfDay(new Date()).getTime();
    let guard = 0;
    while (startOfDay(next).getTime() < todayStart && guard < 1000){ next = advanceDate(next, t.repeat); guard++; }
    t.due = next.toISOString();
    t.done = false; t.status = "offen"; t.completedAt = null;
    // Teilschritte für den neuen Durchlauf zurücksetzen
    if (t.subtasks && t.subtasks.length) t.subtasks.forEach(s => s.done = false);
    showToast(`Nächste Fälligkeit: ${dueInfo(t.due, t.hasTime).label}`);
    render(); pushUpsert(t, false);
    return;
  }

  t.done = !t.done;
  t.status = t.done ? "erledigt" : "offen";
  t.completedAt = t.done ? Date.now() : null;
  render(); pushUpsert(t, false);
}

function toggleSub(id, sid){
  const t = TASKS.find(x => x.id === id); if (!t) return;
  const s = (t.subtasks||[]).find(x => x.id === sid); if (!s) return;
  s.done = !s.done; render(); pushUpsert(t, false);
}

function removeTask(id){
  const idx = TASKS.findIndex(x => x.id === id); if (idx < 0) return;
  const t = TASKS[idx];
  t.deletedAt = Date.now();
  TASKS.splice(idx, 1);
  TRASH.unshift(t);
  closeSheet(); render();
  pushUpsert(t, true);   // in der Cloud als trashed markieren
  showToast(`„${t.text || 'Aufgabe'}" in den Papierkorb`, () => {
    const j = TRASH.findIndex(x => x.id === id);
    if (j >= 0) TRASH.splice(j, 1);
    delete t.deletedAt;
    TASKS.push(t); render(); pushUpsert(t, false);
  });
}

function restoreTask(id){
  const idx = TRASH.findIndex(x => x.id === id); if (idx < 0) return;
  const t = TRASH[idx];
  TRASH.splice(idx, 1);
  delete t.deletedAt;
  TASKS.push(t); render();
  pushUpsert(t, false);
  showToast("Wiederhergestellt");
}

function purgeTask(id){
  const idx = TRASH.findIndex(x => x.id === id); if (idx < 0) return;
  TRASH.splice(idx, 1); render(); pushDelete(id);
}

function emptyTrash(){
  if (!TRASH.length) return;
  const old = TRASH.slice();
  TRASH = []; render();
  old.forEach(t => pushDelete(t.id));
  showToast(`Papierkorb geleert (${old.length})`);
}

/* Liest eine Bilddatei als verkleinertes Logo ein.
   - SVG: unverändert als Data-URL (skaliert verlustfrei, ist klein).
   - PNG/JPG/etc.: auf max. 128px herunterskaliert via Canvas → PNG-DataURL.
   So bleibt der in Supabase gespeicherte String klein und synct mühelos. */
function readLogoFile(file){
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')){ reject(new Error('Keine Bilddatei')); return; }
    if (file.size > 5 * 1024 * 1024){ reject(new Error('Bild zu groß (max. 5 MB)')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Lesefehler'));
    // SVG direkt durchreichen
    if (file.type === 'image/svg+xml'){
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
      return;
    }
    // Rasterbild verkleinern
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 128;
        let { width, height } = img;
        if (width > height){ if (width > MAX){ height = Math.round(height * MAX / width); width = MAX; } }
        else { if (height > MAX){ width = Math.round(width * MAX / height); height = MAX; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        try { resolve(canvas.toDataURL('image/png')); }
        catch(e){ reject(new Error('Konvertierung fehlgeschlagen')); }
      };
      img.onerror = () => reject(new Error('Ungültiges Bild'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function taskCardHTML(t){
  const di = dueInfo(t.due, t.hasTime);
  const p = PRIO[t.priority] || PRIO[0];
  const hasSubs = (t.subtasks||[]).length > 0;
  const open = openSubsState[t.id];
  const isRem = t.type === "reminder";
  const stKey = statusOf(t);
  // „Offen" nur zeigen, wenn keine Priorität gesetzt ist (sonst doppelt-rot mit P-Flag).
  // „Erledigt" nie als Chip (Karte ist eh durchgestrichen).
  const showStatus = stKey !== "erledigt" && !(stKey === "offen" && t.priority > 0);
  const st = showStatus ? STATUS_META[stKey] : null;
  const flagFill = c => IC.flag.replace('CURRENTFILL', c);

  let meta = '';
  if (t.category || di || t.priority>0 || hasRepeat(t.repeat) || st || t.effort){
    meta = '<div class="t-meta">';
    if (t.priority>0) meta += `<span class="pflag" style="color:${p.c}">${flagFill(p.c)}${p.t}</span>`;
    if (st) meta += `<span class="chip status"><span class="st-dot" style="background:${st.c}"></span><span style="color:${st.c}">${st.lbl}</span></span>`;
    if (di) meta += `<span class="chip due ${di.overdue?'over':''}">${IC.cal}${di.label}</span>`;
    if (t.effort) meta += `<span class="chip effort">${IC.clock}${EFFORT_LBL[t.effort]||t.effort}</span>`;
    if (hasRepeat(t.repeat)) meta += `<span class="chip rep">${IC.repeat}${repeatLabel(t.repeat)}</span>`;
    if (t.category) meta += `<span class="chip cat">#${esc(t.category)}</span>`;
    meta += '</div>';
  }

  let subs = '';
  if (hasSubs && open){
    subs = '<div class="subs" data-stop="1">';
    t.subtasks.forEach(s => {
      subs += `<div class="sub ${s.done?'done':''}"><span class="scbox ${s.done?'checked':''}" data-sub="${esc(t.id)}|${esc(s.id)}">${s.done?IC.check:''}</span><span>${esc(s.text)}</span></div>`;
    });
    subs += '</div>';
  }

  const flagIcon = '<svg viewBox="0 0 24 24" fill="'+(p.c)+'" stroke="'+p.c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>';

  return `<div class="task ${t.done?'done':''}" data-card="${esc(t.id)}">
    <div class="pbar" style="background:${p.c}"></div>
    <div class="task-row">
      <button class="cbox ${isRem?'rem':''} ${t.done?'checked':''}" data-toggle="${esc(t.id)}" aria-label="Erledigt">${t.done?IC.check:''}</button>
      <div class="t-body" data-edit="${esc(t.id)}">
        <div class="t-head">${(isRem || t.notify)?'<span class="bell-i" style="display:flex">'+IC.bell+'</span>':''}<span class="t-text">${esc(t.text)}</span></div>
        ${t.notes?`<div class="t-notes">${esc(t.notes)}</div>`:''}
        ${meta}

        ${hasSubs?`<button class="iconbtn" data-subtoggle="${esc(t.id)}">${open?IC.chevDown:IC.chevRight}</button>`:''}

function groupHTML(label, arr, over){
  if (!arr.length) return '';
  let h = `<div class="group-h ${over?'over':''}"><span class="lbl">${label}</span><span class="ln"></span><span class="cnt">${arr.length}</span></div>`;
  h += arr.map(taskCardHTML).join('');
  return h;
}

function computeGroups(active){
  const g = { over:[], today:[], soon:[], later:[], none:[] };
  active.forEach(t => {
    if (!t.due){ g.none.push(t); return; }
    const di = dueInfo(t.due,t.hasTime).diff;
    if (di < 0) g.over.push(t);
    else if (di === 0) g.today.push(t);
    else if (di <= 6) g.soon.push(t);
    else g.later.push(t);
  });
  return g;
}

function renderToday(active, completed){
  const now = new Date();
  const greet = `${now.getHours()<11?"Guten Morgen":now.getHours()<18?"Guten Tag":"Guten Abend"}${NAME.trim()?", "+esc(NAME.trim()):""}`;
  const dateStr = `${WD_LONG[now.getDay()]}, ${now.getDate()}. ${MONTHS[now.getMonth()]}`;
  const g = computeGroups(active);
  const todayDone = completed.filter(t => {
    const ref = t.completedAt ? new Date(t.completedAt) : (t.due ? new Date(t.due) : null);
    return ref && startOfDay(ref).getTime() === startOfDay(now).getTime();
  });
  const total = g.today.length + todayDone.length;

  let h = `<div class="today-head"><div class="today-greet">${greet}</div><div class="today-date">${dateStr}</div>`;
  if (total>0){
    h += `<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${Math.round(todayDone.length/total*100)}%"></div></div><span class="progress-txt">${todayDone.length}/${total} erledigt</span></div>`;
  }
  h += `</div>`;

  // In-App-Erinnerungen: fällige/überfällige Aufgaben mit aktivem Glocken-Toggle.
  const due = dueReminders(active);
  if (due.length){
    const items = due.slice(0,4).map(t => {
      const di = dueInfo(t.due, t.hasTime);
      const when = di ? (di.overdue ? `<span style="color:var(--p1)">${di.label}</span>` : di.label) : '';
      return `<div class="rem-item">
        <button class="rem-open" data-edit="${esc(t.id)}"><span class="rem-dot"></span><span class="rem-txt">${esc(t.text)}</span>${when?`<span class="rem-when">${when}</span>`:''}</button>
        <button class="rem-del" data-del="${esc(t.id)}" aria-label="Löschen">${IC.trash2}</button>
      </div>`;
    }).join('');
    const more = due.length>4 ? `<div class="rem-more">+${due.length-4} weitere</div>` : '';
    h += `<div class="rem-banner">
      <div class="rem-head"><span class="rem-bell">${IC.bell}</span><span class="rem-title">${due.length} ${due.length===1?'Erinnerung':'Erinnerungen'}</span></div>
      <div class="rem-list">${items}${more}</div>
    </div>`;
  }

  h += groupHTML("Überfällig", g.over, true);
  h += groupHTML("Heute", g.today, false);
  if (!g.over.length && !g.today.length && !todayDone.length){
    h += `<div class="empty"><div class="display">Für heute ist nichts geplant.</div><div style="font-size:13px">Genieß den freien Kopf — oder wirf oben was Neues rein.</div></div>`;
  }
  h += groupHTML("Heute erledigt", todayDone, false);
  return h;
}

function renderList(active, completed){
  // Bereichsfilter anwenden
  let banner = '';
  if (AREA_FILTER){
    const isNone = AREA_FILTER === '__none__';
    const label = isNone ? 'Ohne Bereich' : AREA_FILTER;
    active = active.filter(t => isNone ? !t.category : t.category === AREA_FILTER);
    completed = completed.filter(t => isNone ? !t.category : t.category === AREA_FILTER);
    banner = `<div class="filter-banner"><span>Bereich: <b>${esc(label)}</b></span><button id="clearFilter">${IC.x}Filter aufheben</button></div>`;
  }
  const g = computeGroups(active);
  let h = banner + groupHTML("Überfällig", g.over, true)
        + groupHTML("Heute", g.today, false)
        + groupHTML("Diese Woche", g.soon, false)
        + groupHTML("Später", g.later, false)
        + groupHTML("Kein Datum", g.none, false);
  if (completed.length) h += groupHTML("Erledigt", completed, false);
  if (!active.length && !completed.length){
    h = banner + `<div class="empty"><div class="display">${AREA_FILTER?'Keine Aufgaben in diesem Bereich.':'Noch nichts geplant.'}</div><div style="font-size:13px">${AREA_FILTER?'':'Schreib deine erste Aufgabe oben rein — oder tipp aufs Regler-Symbol für alle Details.'}</div></div>`;
  }
  return h;
}

function renderMatrix(active){
  const tasksOnly = active.filter(t => t.type === "task");
  const isUrgent = t => t.due && dueInfo(t.due,t.hasTime).diff <= 1;
  const isImportant = t => t.priority > 0 && t.priority <= 2;
  const quads = {
    q1: tasksOnly.filter(t => isUrgent(t) && isImportant(t)),
    q2: tasksOnly.filter(t => !isUrgent(t) && isImportant(t)),
    q3: tasksOnly.filter(t => isUrgent(t) && !isImportant(t)),
    q4: tasksOnly.filter(t => !isUrgent(t) && !isImportant(t)),
  };
  const META = [["q1","Sofort tun","dringend + wichtig"],["q2","Einplanen","wichtig, nicht dringend"],
    ["q3","Schnell abhaken","dringend, nicht wichtig"],["q4","Wenn Zeit ist","beides niedrig"]];
  let h = '<div class="matrix">';
  META.forEach(([k,title,sub]) => {
    const arr = quads[k];
    h += `<div class="quad ${k}"><div class="quad-h"><span class="qt">${title}</span><span class="qs">${arr.length}</span></div><div class="qsub">${sub}</div>`;
    if (!arr.length) h += `<div class="q-empty">leer</div>`;
    else arr.forEach(t => {
      const c = (PRIO[t.priority]&&PRIO[t.priority].c!=="transparent") ? PRIO[t.priority].c : "var(--faint)";
      h += `<div class="mtask" data-edit="${esc(t.id)}"><span class="mc" style="border-color:${c}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.text)}</span></div>`;
    });
    h += `</div>`;
  });
  h += '</div>';
  return h;
}

function renderTrash(){
  let h = '';
  if (TRASH.length) h += `<div class="trash-bar"><button class="empty-trash" data-emptytrash="1">${IC.trash}Leeren</button></div>`;
  if (!TRASH.length){
    h += `<div class="empty"><div style="color:var(--faint);margin-bottom:12px;display:flex" class="big-icon">${IC.inbox}</div><div class="display">Papierkorb ist leer.</div></div>`;
  } else {
    TRASH.forEach(t => {
      const di = dueInfo(t.due, t.hasTime);
      h += `<div class="trash-card"><div class="tc-body"><span class="tc-text">${esc(t.text)}</span><span class="tc-meta">${di?di.label+' · ':''}gelöscht ${timeAgo(t.deletedAt)}</span></div><div class="tc-actions"><button class="tc-btn restore" data-restore="${esc(t.id)}" title="Wiederherstellen">${IC.restore}</button><button class="tc-btn purge" data-purge="${esc(t.id)}" title="Endgültig löschen">${IC.trash}</button></div></div>`;
    });
  }
  return h;
}

/* Bereiche = Lebensbereiche = Kategorien. Übersicht + Verwaltung in einem. */
function renderAreas(active){
  // Aufgaben je Kategorie zählen + Aufwand summieren (nur aktive)
  const map = {};
  active.forEach(t => {
    const k = t.category || "__none__";
    if (!map[k]) map[k] = { count:0, minutes:0 };
    map[k].count++;
    if (t.effort) map[k].minutes += parseInt(t.effort,10) || 0;
  });
  const cats = categoriesList();
  const fmtTime = m => m>=60 ? `${(m/60).toFixed(m%60?1:0)} Std` : `${m} min`;

  let h = '';
  if (cats.length){
    h += `<p class="mode-hint">Tipp einen Bereich an, um nur dessen Aufgaben zu sehen.</p>`;
  }

  if (!cats.length){
    h += `<div class="empty"><div class="big-icon" style="color:var(--faint);margin-bottom:12px;display:flex;justify-content:center">${IC.layers}</div><div class="display">Noch keine Bereiche.</div><div style="font-size:13px">Vergib beim Anlegen einer Aufgabe eine Kategorie (z. B. <b>#arbeit</b>) — sie taucht dann automatisch hier auf.</div></div>`;
  } else {
    h += `<div class="area-grid">`;
    cats.forEach((c,i) => {
      const m = map[c] || { count:0, minutes:0 };
      const hue = (i*67) % 360;   // jedem Bereich eine eigene, dezente Farbe
      h += `<div class="area-card" data-catfilter="${esc(c)}">
        <div class="area-bar" style="background:hsl(${hue} 55% 60%)"></div>
        <div class="area-main">
          <div class="area-name">${esc(c)}</div>
          <div class="area-stats">${m.count} ${m.count===1?'Aufgabe':'Aufgaben'}${m.minutes?` · ~${fmtTime(m.minutes)}`:''}</div>
        </div>
        <div class="area-actions">
          <button class="area-btn" data-arearename="${esc(c)}" title="Umbenennen">${IC.edit}</button>
          <button class="area-btn del" data-areadelete="${esc(c)}" title="Bereich löschen">${IC.trash}</button>
        </div>
      </div>`;
    });
    // "Ohne Bereich" als nicht-editierbare Karte, falls vorhanden
    if (map["__none__"]){
      const m = map["__none__"];
      h += `<div class="area-card muted" data-catfilter="__none__">
        <div class="area-bar" style="background:var(--faint)"></div>
        <div class="area-main"><div class="area-name">Ohne Bereich</div><div class="area-stats">${m.count} ${m.count===1?'Aufgabe':'Aufgaben'}${m.minutes?` · ~${fmtTime(m.minutes)}`:''}</div></div>
      </div>`;
    }
    h += `</div>`;
  }
  return h;
}

/* Links = persönliche Shortcut-Sammlung */
function renderLinks(){
  let h = `<div class="links-top"><button class="link-add" id="addLinkBtn">${IC.plus}Link hinzufügen</button></div>`;

  if (!LINKS.length){
    h += `<div class="empty"><div class="big-icon" style="color:var(--faint);margin-bottom:12px;display:flex;justify-content:center">${IC.link}</div><div class="display">Noch keine Links.</div><div style="font-size:13px">Sammle hier ILIAS, GitHub, Claude & Co. — alles, was du oft brauchst.</div></div>`;
    return h;
  }

  // Nach Kategorie gruppieren (favorisierte zuerst innerhalb)
  const groups = {};
  LINKS.forEach(l => { const k = l.category || '__none__'; (groups[k] = groups[k] || []).push(l); });
  const keys = Object.keys(groups).sort((a,b) => a==='__none__'?1:b==='__none__'?-1:a.localeCompare(b));

  keys.forEach(k => {
    if (k !== '__none__') h += `<div class="link-group-lbl">${esc(k)}</div>`;
    else if (keys.length > 1) h += `<div class="link-group-lbl">Sonstige</div>`;
    h += `<div class="link-grid">`;
    groups[k].forEach(l => {
      h += `<div class="link-card">
        <a class="link-open" href="${esc(l.url)}" target="_blank" rel="noopener">
          <img class="link-fav" src="${l.icon ? esc(l.icon) : faviconFor(l.url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
          <span class="link-info"><span class="link-title">${esc(l.title)}</span><span class="link-host">${esc(hostOf(l.url))}</span></span>
        </a>
        <div class="link-actions">
          <button class="link-btn ${l.fav?'on':''}" data-linkfav="${esc(l.id)}" title="Favorit">${IC.star.replace('CURRENTFILL', l.fav?'currentColor':'none')}</button>
          <button class="link-btn" data-linkedit="${esc(l.id)}" title="Bearbeiten">${IC.edit}</button>
          <button class="link-btn del" data-linkdelete="${esc(l.id)}" title="Löschen">${IC.trash}</button>
        </div>
      </div>`;
    });
    h += `</div>`;
  });
  return h;
}

/* ═══════════════ BEREICHE (Second Brain: Notizen + Dokumente + Tools) ═══════════════ */

function areaById(id){ return AREAS.find(a => a.id === id); }
function notesInAreaId(areaId){
  return NOTES.filter(n => n.areaId === areaId).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
}
function docsInAreaId(areaId){
  // Dokumente liegen als Notiz-ähnliche Objekte vor (_kind:"note", type:"doc").
  // Nur "echte" Dokumente mit gültigem Storage-Pfad — tote/abgebrochene Einträge ausblenden.
  return NOTES.filter(n => n.areaId === areaId && n.type === 'doc' && n.docPath);
}
// Existiert ein Dokument wirklich (Objekt + Storage-Pfad)?
function docExists(id){
  const d = NOTES.find(n => n.id === id && n.type === 'doc');
  return !!(d && d.docPath);
}
// Ordner eines Bereichs
function foldersInAreaId(areaId){
  return NOTES.filter(n => n.areaId === areaId && n.type === 'docfolder').sort((a,b)=>(a.title||'').localeCompare(b.title||''));
}
// Dokumente in einem bestimmten Ordner (oder lose, wenn folderId null).
// Schutz: Zeigt ein Dokument auf einen nicht mehr existierenden Ordner, gilt es als lose (Wurzel) —
// so geht nie ein Dokument "verloren", selbst wenn sein Ordner mal verwaist ist.
function docsInFolder(areaId, folderId){
  return NOTES.filter(n => {
    if (n.areaId !== areaId || n.type !== 'doc') return false;
    let fid = n.folderId || null;
    if (fid && !folderById(fid)) fid = null;   // verwaist → Wurzel
    return fid === (folderId || null);
  }).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
function folderById(id){ return NOTES.find(n => n.id === id && n.type === 'docfolder'); }
function docFolderCreate(areaId, name){
  name = (name||'').trim(); if (!name) return null;
  const f = { _kind:'note', id:'folder-'+uid(), areaId, type:'docfolder', title:name, createdAt:Date.now(), updatedAt:Date.now() };
  NOTES.unshift(f); pushUpsert(f, false); return f;
}
function docFolderDelete(id){
  // Dokumente im Ordner wandern zurück in die Wurzel (nicht löschen!)
  NOTES.forEach(n => { if (n.type==='doc' && n.folderId===id){ n.folderId = null; pushUpsert(n, false); } });
  const f = folderById(id);
  NOTES = NOTES.filter(n => n.id !== id);
  if (f) cloudDelete(f.id).catch(()=>{});
}
function docMoveToFolder(docId, folderId){
  const d = NOTES.find(n => n.id === docId && n.type === 'doc');
  if (d){ d.folderId = folderId || null; pushUpsert(d, false); }
}
// Sheet zum Verschieben eines Dokuments in einen Ordner (oder in die Wurzel)
function openMoveSheet(docId){
  const d = NOTES.find(n => n.id === docId && n.type === 'doc');
  if (!d) return;
  const folders = foldersInAreaId(d.areaId);
  const ov = document.createElement('div');
  ov.className = 'overlay';
  let opts = `<button class="move-opt ${!d.folderId?'on':''}" data-moveto="">${IC.paperclip} Keine (Übersicht)</button>`;
  folders.forEach(f => {
    opts += `<button class="move-opt ${d.folderId===f.id?'on':''}" data-moveto="${esc(f.id)}">${IC.folder} ${esc(f.title)}</button>`;
  });
  ov.innerHTML = `<div class="sheet" id="sportSheetInner">
    <div class="sheet-head"><div class="sheet-title">Verschieben nach…</div><button class="sheet-x" id="moveClose">${IC.x}</button></div>
    <div class="sheet-body"><div class="move-list">${opts}</div></div>
  </div>`;
  ov.onmousedown = e => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
  $('moveClose').onclick = () => ov.remove();
  ov.querySelectorAll('[data-moveto]').forEach(b => b.onclick = () => {
    docMoveToFolder(docId, b.dataset.moveto || null);
    ov.remove(); render(); showToast('Verschoben ✓');
  });
}

function renderBereiche(){
  // Ebene 3: einzelne Notiz offen
  if (NOTE_OPEN){
    const note = NOTES.find(n => n.id === NOTE_OPEN);
    if (note) return renderNoteDetail(note);
    NOTE_OPEN = null;
  }
  // Ebene 2: Bereich offen → Tabs
  if (AREA_OPEN){
    const area = areaById(AREA_OPEN);
    if (area) return renderAreaDetail(area);
    AREA_OPEN = null;
  }
  // Ebene 1: Bereichs-Übersicht
  const sorted = AREAS.slice().sort((a,b)=>{
    // Sport (hasTools) zuerst, Rest alphabetisch
    if (a.id === SPORT_AREA_ID) return -1;
    if (b.id === SPORT_AREA_ID) return 1;
    return a.name.localeCompare(b.name);
  });
  let h = '';
  if (!sorted.length){
    h += `<div class="notes-empty">Noch keine Bereiche. Leg dein erstes Lebensthema an — z. B. Auto, Steuer, Studium oder Rechtsschutz.</div>`;
  } else {
    h += `<div class="fokus-grid">`;
    sorted.forEach(area => {
      const noteCnt = notesInAreaId(area.id).filter(n=>n.type!=='doc').length;
      const docCnt = docsInAreaId(area.id).length;
      const parts = [];
      if (area.hasTools) parts.push('Tools');
      parts.push(`${noteCnt} ${noteCnt===1?'Notiz':'Notizen'}`);
      if (docCnt) parts.push(`${docCnt} Dok.`);
      h += `<button class="fokus-card" data-areaopen="${esc(area.id)}">
        <span class="fokus-card-ic">${IC[area.icon]||IC.note}</span>
        <span class="fokus-card-txt">
          <span class="fokus-card-title">${esc(area.name)}</span>
          <span class="fokus-card-desc">${parts.join(' · ')}</span>
        </span>
        <span class="fokus-card-arrow">${IC.chevRight}</span>
      </button>`;
    });
    h += `</div>`;
  }
  h += `<button class="notes-addarea" data-areaadd="1">${IC.plus} Bereich anlegen</button>`;
  return h;
}

function renderAreaDetail(area){
  let h = `<button class="fokus-back" data-areaback="1">${IC.chevLeft} Alle Bereiche</button>`;
  h += `<div class="notes-area-head"><div class="notes-area-title">${esc(area.name)}</div>`;
  // Sport-Bereich nicht löschbar (Kern-Feature), andere schon
  if (area.id !== SPORT_AREA_ID){
    h += `<button class="notes-area-del" data-areadel="${esc(area.id)}" aria-label="Bereich löschen">${IC.trash2}</button>`;
  }
  h += `</div>`;
  // Tabs: Notizen / Dokumente / (Tools)
  h += `<div class="subtabs">
    <button class="subtab ${AREA_TAB==='notes'?'on':''}" data-areatab="notes">${IC.note}Notizen</button>
    <button class="subtab ${AREA_TAB==='docs'?'on':''}" data-areatab="docs">${IC.cart&&IC.paperclip?IC.paperclip:IC.link}Dokumente</button>
    ${area.hasTools?`<button class="subtab ${AREA_TAB==='tools'?'on':''}" data-areatab="tools">${IC.dumbbell}Tools</button>`:''}
  </div>`;
  if (AREA_TAB === 'notes')      h += renderAreaNotes(area);
  else if (AREA_TAB === 'docs')  h += renderAreaDocs(area);
  else if (AREA_TAB === 'tools' && area.hasTools) h += renderSport();
  return h;
}

function renderAreaNotes(area){
  // NUR echte Notizen (text/checklist) — keine Dokumente, keine Ordner!
  const notes = notesInAreaId(area.id).filter(n => n.type !== 'doc' && n.type !== 'docfolder');
  let h = '';
  if (!notes.length){
    h += `<div class="notes-empty">Noch keine Notizen in „${esc(area.name)}". Leg unten die erste an.</div>`;
  } else {
    h += `<div class="notes-list">`;
    notes.forEach(n => {
      const preview = n.type === 'checklist'
        ? `${(n.items||[]).filter(i=>i.done).length}/${(n.items||[]).length} erledigt`
        : (n.body || '').replace(/\n/g,' ').slice(0,80) || 'Leer';
      h += `<button class="note-card" data-noteopen="${esc(n.id)}">
        <div class="note-card-top">
          <span class="note-card-icon">${n.type==='checklist'?IC.check_sm:IC.note}</span>
          <span class="note-card-title">${esc(n.title||'Ohne Titel')}</span>
        </div>
        <div class="note-card-preview">${esc(preview)}</div>
      </button>`;
    });
    h += `</div>`;
  }
  h += `<div class="notes-add-row">
    <button class="notes-addnote" data-noteadd="${esc(area.id)}:text">${IC.plus} Notiz</button>
    <button class="notes-addnote" data-noteadd="${esc(area.id)}:checklist">${IC.check_sm} Checkliste</button>
  </div>`;
  return h;
}

function renderAreaDocs(area){
  // Ordner-Ansicht: in einem Ordner drin
  if (DOC_FOLDER){
    const folder = folderById(DOC_FOLDER);
    if (!folder){ DOC_FOLDER = null; }
    else return renderDocFolder(area, folder);
  }
  // Wurzel-Ansicht: Ordner + lose Dokumente
  const folders = foldersInAreaId(area.id);
  const looseDocs = docsInFolder(area.id, null);
  let h = `<div class="docs-note">Wichtige Dokumente für „${esc(area.name)}" — Fahrzeugschein, Policen, Bescheide. In Ordnern sortierbar.</div>`;
  h += `<div class="docs-actions">
    <button class="docs-upload" data-docupload="${esc(area.id)}">${IC.paperclip} Dokument</button>
    <button class="docs-newfolder" data-newfolder="${esc(area.id)}">${IC.folder||IC.layers} Ordner</button>
  </div>`;
  h += `<input type="file" id="docFileInput" accept="image/*,application/pdf" style="display:none">`;
  // Ordner
  if (folders.length){
    h += `<div class="docs-folders">`;
    folders.forEach(f => {
      const cnt = docsInFolder(area.id, f.id).length;
      h += `<div class="docfolder-card" data-folderopen="${esc(f.id)}">
        <span class="docfolder-ic">${IC.folder||IC.layers}</span>
        <span class="docfolder-info"><span class="docfolder-name">${esc(f.title)}</span><span class="docfolder-meta">${cnt} ${cnt===1?'Dokument':'Dokumente'}</span></span>
        <button class="docfolder-del" data-folderdel="${esc(f.id)}" aria-label="Ordner löschen">${IC.trash2}</button>
      </div>`;
    });
    h += `</div>`;
  }
  // Lose Dokumente (ohne Ordner)
  if (looseDocs.length){
    h += `<div class="docs-list">`;
    looseDocs.forEach(d => h += docCardHtml(d, area));
    h += `</div>`;
  }
  if (!folders.length && !looseDocs.length){
    h += `<div class="docs-placeholder">${IC.paperclip}<span>Noch keine Dokumente oder Ordner</span></div>`;
  }
  return h;
}
// Ansicht innerhalb eines Ordners
function renderDocFolder(area, folder){
  const docs = docsInFolder(area.id, folder.id);
  let h = `<button class="fokus-back" data-docfolderback="1">${IC.chevLeft} Alle Dokumente</button>`;
  h += `<div class="notes-area-head"><div class="notes-area-title">${IC.folder||''} ${esc(folder.title)}</div></div>`;
  h += `<button class="docs-upload" data-docupload="${esc(area.id)}" data-intofolder="${esc(folder.id)}">${IC.paperclip} Dokument in diesen Ordner</button>`;
  h += `<input type="file" id="docFileInput" accept="image/*,application/pdf" style="display:none">`;
  if (docs.length){
    h += `<div class="docs-list">`;
    docs.forEach(d => h += docCardHtml(d, area));
    h += `</div>`;
  } else {
    h += `<div class="docs-placeholder">${IC.paperclip}<span>Ordner ist leer</span></div>`;
  }
  return h;
}
// Einzelne Dokumentenkarte (wiederverwendet in Wurzel + Ordner)
function docCardHtml(d, area){
  const isImg = d.docType && d.docType.startsWith('image/');
  const folders = foldersInAreaId(area.id);
  // Verschiebe-Menü nur anbieten, wenn es Ordner gibt
  const moveBtn = folders.length ? `<button class="doc-move" data-docmove="${esc(d.id)}" aria-label="Verschieben">${IC.folder||IC.layers}</button>` : '';
  return `<div class="doc-card">
    <button class="doc-open" data-docopen="${esc(d.id)}">
      <span class="doc-icon">${isImg?IC.image:IC.paperclip}</span>
      <span class="doc-info"><span class="doc-name">${esc(d.title||'Dokument')}</span><span class="doc-meta">${isImg?'Bild':'PDF'}${d.size?` · ${fmtSize(d.size)}`:''}</span></span>
    </button>
    ${moveBtn}
    <button class="doc-del" data-docdel="${esc(d.id)}" aria-label="Löschen">${IC.trash2}</button>
  </div>`;
}
function fmtSize(bytes){
  if (bytes < 1024) return bytes+' B';
  if (bytes < 1024*1024) return Math.round(bytes/1024)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}

function renderNoteDetail(note){
  const area = areaById(note.areaId);

      h += `<div class="note-check-row" data-noteitemidx="${idx}">
        <button class="note-check-box ${it.done?'on':''}" data-notetoggle="${idx}" aria-label="Abhaken">${it.done?IC.check_sm:''}</button>

        <button class="note-check-del" data-noteitemdel="${idx}" aria-label="Löschen">${IC.x}</button>

  }

    h += `<div class="note-links-lbl">Verknüpfungen</div>`;
    links.forEach((lnk, idx) => {
      const target = resolveNoteLink(lnk);
      h += `<div class="note-link-chip" data-notelinkgo="${idx}">
        <span class="note-link-ic">${lnk.kind==='folder'?IC.folder:(lnk.kind==='doc'?IC.paperclip:IC.bullseye)}</span>
        <span class="note-link-txt">${esc(target ? target.label : 'Ziel nicht gefunden')}</span>
        <button class="note-link-del" data-notelinkdel="${idx}" aria-label="Entfernen">${IC.x}</button>
      </div>`;
    });
  }
  h += `<button class="note-addlink" data-noteaddlink="1">${IC.link} Verknüpfung einfügen</button>`;
  h += `</div>`;
  h += `<button class="note-delete" data-notedelete="${esc(note.id)}">${IC.trash}Notiz löschen</button>`;
  h += `</div>`;

/* Löst eine Notiz-Verknüpfung zu ihrem Ziel auf → {label, areaId, ...} oder null */
function resolveNoteLink(lnk){
  if (!lnk) return null;
  if (lnk.kind === 'area'){
    const a = areaById(lnk.areaId); return a ? { label:a.name, areaId:a.id } : null;
  }
  if (lnk.kind === 'folder'){
    const f = folderById(lnk.id); const a = f && areaById(f.areaId);
    return f ? { label:`${a?a.name+' · ':''}${f.title}`, areaId:f.areaId, folderId:f.id } : null;
  }
  if (lnk.kind === 'doc'){
    const d = NOTES.find(n => n.id === lnk.id && n.type === 'doc' && n.docPath); const a = d && areaById(d.areaId);
    return d ? { label:`${a?a.name+' · ':''}${d.title}`, areaId:d.areaId, docId:d.id, folderId:d.folderId } : null;
  }
  return null;
}
/* Auswahl-Sheet für eine Verknüpfung: Bereich → Ordner/Dokument. */
function openLinkPicker(noteId){
  const note = NOTES.find(n => n.id === noteId);
  if (!note) return;
  if (!note.links) note.links = [];
  let pickArea = null;   // gewählter Bereich (für Schritt 2)

  const ov = document.createElement('div');
  ov.className = 'overlay';
  document.body.appendChild(ov);

  function draw(){
    let body = '';
    if (!pickArea){
      // Schritt 1: Bereich wählen
      body += `<div class="link-hint">Wohin soll die Verknüpfung zeigen? Erst Bereich wählen.</div><div class="move-list">`;
      AREAS.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(a => {
        body += `<button class="move-opt" data-pickarea="${esc(a.id)}">${IC[a.icon]||IC.bullseye} ${esc(a.name)}</button>`;
      });
      body += `</div>`;
    } else {
      // Schritt 2: Ziel im Bereich wählen (Bereich selbst, Ordner oder Dokument)
      const a = areaById(pickArea);
      const folders = foldersInAreaId(pickArea);
      const docs = docsInAreaId(pickArea);
      body += `<button class="link-back" id="linkBack">${IC.chevLeft} Anderer Bereich</button>`;
      body += `<div class="link-hint">Ziel in „${esc(a?a.name:'')}" wählen:</div><div class="move-list">`;
      body += `<button class="move-opt" data-picktarget="area:${esc(pickArea)}">${IC.bullseye} Bereich „${esc(a?a.name:'')}" selbst</button>`;
      folders.forEach(f => {
        body += `<button class="move-opt" data-picktarget="folder:${esc(f.id)}">${IC.folder} ${esc(f.title)}</button>`;
      });
      docs.forEach(d => {
        body += `<button class="move-opt" data-picktarget="doc:${esc(d.id)}">${IC.paperclip} ${esc(d.title)}</button>`;
      });
      if (!folders.length && !docs.length){
        body += `<div class="link-empty">Keine Ordner/Dokumente in diesem Bereich — du kannst aber auf den Bereich selbst verlinken.</div>`;
      }
      body += `</div>`;
    }
    ov.innerHTML = `<div class="sheet" id="sportSheetInner">
      <div class="sheet-head"><div class="sheet-title">Verknüpfung einfügen</div><button class="sheet-x" id="linkClose">${IC.x}</button></div>
      <div class="sheet-body">${body}</div>
    </div>`;
    $('linkClose').onclick = () => ov.remove();
    if (pickArea){
      const lb = $('linkBack'); if (lb) lb.onclick = () => { pickArea = null; draw(); };
    }
    ov.querySelectorAll('[data-pickarea]').forEach(b => b.onclick = () => { pickArea = b.dataset.pickarea; draw(); });
    ov.querySelectorAll('[data-picktarget]').forEach(b => b.onclick = () => {
      const [kind, id] = b.dataset.picktarget.split(':');
      const lnk = kind === 'area' ? { kind:'area', areaId:id } : { kind, id };
      note.links.push(lnk);
      noteSave(note);
      ov.remove(); render(); showToast('Verknüpfung hinzugefügt ✓');
    });
  }
  ov.onmousedown = e => { if (e.target === ov) ov.remove(); };
  draw();
}

/* ── Bereiche: Speicher-Helper ── */
function areaAdd(name){
  name = (name||'').trim();
  if (!name) return;
  if (AREAS.some(a => a.name.toLowerCase() === name.toLowerCase())){ showToast('Bereich existiert schon'); return; }
  const obj = { _kind:'area', id:'area-'+uid(), name, icon:'note', hasTools:false, createdAt:Date.now() };
  AREAS.push(obj);
  pushUpsert(obj, false);
}
function areaDelete(id){
  if (id === SPORT_AREA_ID) return;  // Sport ist fest
  const toDelete = NOTES.filter(n => n.areaId === id);
  NOTES = NOTES.filter(n => n.areaId !== id);
  toDelete.forEach(n => cloudDelete(n.id).catch(()=>{}));
  const area = areaById(id);
  AREAS = AREAS.filter(a => a.id !== id);
  if (area) cloudDelete(area.id).catch(()=>{});
}
function noteCreate(areaId, type){
  const note = {
    _kind:'note', id:'note-'+uid(), areaId, type,
    title:'', body: type==='text' ? '' : undefined,
    items: type==='checklist' ? [] : undefined,
    createdAt:Date.now(), updatedAt:Date.now(),
  };
  NOTES.unshift(note);
  pushUpsert(note, false);
  return note;
}
function noteSave(note){ note.updatedAt = Date.now(); pushUpsert(note, false); }
function noteDelete(id){
  const obj = NOTES.find(n => n.id === id);
  // Sicherheitsnetz: Ist es in Wahrheit ein Ordner? Dann über docFolderDelete (Docs bleiben erhalten).
  if (obj && obj.type === 'docfolder'){ docFolderDelete(id); return; }
  // Sicherheitsnetz: Ist es ein Dokument? Dann über docDelete (entfernt auch die Datei sauber).
  if (obj && obj.type === 'doc'){ docDelete(id); return; }
  NOTES = NOTES.filter(n => n.id !== id);
  cloudDelete(id).catch(()=>{});
}

/* ── Dokumente: Upload zu Supabase Storage ──
   Bucket "documents" muss in Supabase existieren (öffentlich lesbar).
   Datei wird hochgeladen, öffentliche URL geholt, als note (type:doc) gespeichert. */
const DOC_BUCKET = 'documents';
async function uploadDoc(areaId, file, folderId){
  // Größe begrenzen (10 MB), sonst sprengt es Gratis-Speicher schnell
  if (file.size > 10*1024*1024){ showToast('Datei zu groß (max. 10 MB)'); return; }
  if (!sb){ showToast('Keine Verbindung'); return; }
  showToast('Lade hoch…');
  try {
    const ext = (file.name.split('.').pop()||'dat').toLowerCase();
    const path = `${USER.id}/${areaId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error: upErr } = await sb.storage.from(DOC_BUCKET).upload(path, file, { upsert:false, contentType:file.type });
    if (upErr) throw upErr;
    // Privater Bucket: keine public-URL, nur den Pfad merken. Link wird beim Öffnen frisch erzeugt.
    const doc = {
      _kind:'note', id:'doc-'+uid(), areaId, type:'doc',
      title: file.name, docPath: path,
      docType: file.type, size: file.size,
      folderId: folderId || null,
      createdAt:Date.now(), updatedAt:Date.now(),
    };
    NOTES.unshift(doc);
    pushUpsert(doc, false);
    render();
    showToast('Hochgeladen ✓');
  } catch(e){
    console.warn('Upload-Fehler:', e.message);
    showToast('Upload fehlgeschlagen — ist der Bucket eingerichtet?');
  }
}
function docDelete(id){
  const doc = NOTES.find(n => n.id === id);
  NOTES = NOTES.filter(n => n.id !== id);
  cloudDelete(id).catch(()=>{});
  // Datei aus Storage entfernen
  if (doc && doc.docPath && sb){
    sb.storage.from(DOC_BUCKET).remove([doc.docPath]).catch(()=>{});
  }
}

function fmtLogDate(ts){
  const d = new Date(ts), today = startOfDay(new Date()).getTime(), day = startOfDay(d).getTime();
  const diff = Math.round((today-day)/86400000);
  if (diff===0) return 'heute';
  if (diff===1) return 'gestern';
  if (diff<7) return `vor ${diff}d`;
  return `${d.getDate()}.${d.getMonth()+1}.`;
}

/* Fortschritts-Zeile für Kraftübungen: "Letztes 70×8 · Best 75×6".
   Bestleistung = Satz mit dem höchsten Gewicht über alle bisherigen Logs.
   Extrem schlicht gehalten, zeigt nur was wirklich hilft (Progressive Overload). */
function progressLine(ex){
  const logs = ex.log || [];
  if (!logs.length) return '';
  // bestes Gewicht über alle Sätze aller Logs finden
  let best = null;   // {kg, reps}
  logs.forEach(l => {
    (l.sets || []).forEach(s => {
      const kg = parseFloat(String(s.kg).replace(',','.'));
      if (!isNaN(kg)){
        if (!best || kg > best.kg) best = { kg, reps: s.reps };
      }
    });
  });
  // letztes Training: bester (schwerster) Satz des jüngsten Logs
  const lastLog = logs[logs.length-1];
  let lastTop = null;
  (lastLog.sets || []).forEach(s => {
    const kg = parseFloat(String(s.kg).replace(',','.'));
    if (!isNaN(kg)){ if (!lastTop || kg > lastTop.kg) lastTop = { kg, reps: s.reps }; }
  });
  const parts = [];
  if (lastTop) parts.push(`<span class="prog-last">Letztes ${fmtKg(lastTop.kg)}×${esc(String(lastTop.reps))}</span>`);
  if (best) parts.push(`<span class="prog-best">${IC.trophy||'★'} Best ${fmtKg(best.kg)}×${esc(String(best.reps))}</span>`);
  if (!parts.length) return '';
  return `<div class="sport-progress">${parts.join('')}</div>`;
}
function fmtKg(n){ return (Math.round(n*10)/10).toString().replace('.',',') + ' kg'; }

function weightChartSVG(){
  const pts = WEIGHTS.map(w => ({ x: w.date, y: w.kg }));
  const minY = Math.min(...pts.map(p=>p.y)), maxY = Math.max(...pts.map(p=>p.y));
  const minX = pts[0].x, maxX = pts[pts.length-1].x;
  const W = 320, H = 140, pad = 30;
  const range = (maxY - minY) || 1, spanX = (maxX - minX) || 1;
  const sx = x => pad + (x - minX)/spanX * (W - pad*2);
  const sy = y => H - pad - (y - minY)/range * (H - pad*2);
  const path = pts.map((p,i) => `${i===0?'M':'L'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');
  const dots = pts.map(p => `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="3" fill="var(--accent)"/>`).join('');
  return `<div class="weight-chart"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">
    <text x="${pad-6}" y="${(sy(maxY)+4).toFixed(1)}" text-anchor="end" class="wc-axis">${maxY}</text>
    <text x="${pad-6}" y="${(sy(minY)+4).toFixed(1)}" text-anchor="end" class="wc-axis">${minY}</text>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
  </svg></div>`;
}

/* Ernährungsdaten holen/initialisieren (liegt in WORKOUT.nutrition, synct mit). */
function getNutrition(){
  if (!WORKOUT) WORKOUT = defaultWorkoutPlan();
  if (!WORKOUT.nutrition) WORKOUT.nutrition = defaultNutrition();
  const def = defaultNutrition();
  const n = WORKOUT.nutrition;
  // Migration: neuer Rezept-Pool + kalibrierte Ziele — Verlaufsdaten (chosen, proteinToday) bleiben erhalten
  if ((n._nutver || 1) < def._nutver){
    n.recipes = def.recipes;
    n.week = def.week;
    // Ziele auf kalibrierten Startwert setzen, sofern noch auf altem Default (2400/180) oder fehlend.
    // So überschreiben wir keine bewusst angepassten Werte.
    const wasDefault = !n.goals || (n.goals.kcal === 2400 && n.goals.protein === 180);
    if (wasDefault) n.goals = { ...def.goals };
    n._nutver = def._nutver;
    if (!n.goals) n.goals = def.goals;
    pushUpsert(WORKOUT, false);
  }
  if (!n.recipes) n.recipes = def.recipes;
  if (!n.week) n.week = def.week;
  if (!n.goals) n.goals = def.goals;
  if (!n.chosen) n.chosen = {};
  if (!n.proteinToday) n.proteinToday = {};
  return n;
}

  </div>`;

}

/* Wochentag-Index → Datumsschlüssel der laufenden Woche (für Tagesdaten). */
function dateKeyForWeekday(i){
  const today = new Date();
  const jsIdx = today.getDay() === 0 ? 6 : today.getDay()-1;
  const diff = i - jsIdx;
  const d = new Date(today); d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function dayPlanProtein(n, plan){
  let sum = 0;
  Object.values(plan.meals).forEach(rid => { if (rid && n.recipes[rid]) sum += n.recipes[rid].protein||0; });
  return sum;
}
function dayPlanKcal(n, plan){
  let sum = 0;
  Object.values(plan.meals).forEach(rid => { if (rid && n.recipes[rid]) sum += n.recipes[rid].kcal||0; });
  return sum;
}

/* ── Einkaufsliste für die Woche ──
   Sammelt die Zutaten der GEWÄHLTEN Option pro Tag, fasst gleiche zusammen
   (mit Mengen-Summe wo Einheit erkennbar) und sortiert nach Lidl-Abteilungen. */

// Lidl-Abteilungs-Zuordnung per Stichwort (für übersichtliches Einkaufen)
const LIDL_KATEGORIEN = [
  { kat:'Obst & Gemüse', keys:['banane','beeren','brokkoli','paprika','tomate','spinat','zwiebel','kartoffel','pilz','zitrone','avocado','kiwi','ananas','kaisergemüse','blattspinat'] },
  { kat:'Kühlregal (Molkerei & Eier)', keys:['magerquark','quark','skyr','milch','frischkäse','eier','joghurt','butter'] },
  { kat:'Fleisch & Fisch', keys:['hähnchen','hackfleisch','hack','thunfisch','lachs','garnelen','pute'] },
  { kat:'Trockenwaren & Vorrat', keys:['haferflocken','reis','nudeln','vollkornnudeln','dinkelnudeln','buchweizen','eiweißbrot','linsen','proteinpulver','scoop','erdnussbutter','honig','öl','olivenöl','nüsse','mandeln','sojasauce','kräuter','gewürz','wasser','kaffee'] },
];
function lidlKategorie(name){
  const low = name.toLowerCase();
  for (const g of LIDL_KATEGORIEN){
    if (g.keys.some(k => low.includes(k))) return g.kat;
  }
  return 'Sonstiges';
}
/* Zerlegt "180 g Hähnchenbrust" in {menge:180, einheit:'g', artikel:'Hähnchenbrust'}.
   Erkennt g, ml, Stück/Dose/Scoop/EL etc. Wenn keine Menge erkennbar: menge null. */
function parseZutat(z){
  const m = z.match(/^(\d+(?:[.,]\d+)?)\s*(g|kg|ml|l|el|tl|scoop|dose|dosen|stück|stk|prise)?\s*(.*)$/i);
  if (m && m[1]){
    return { menge: parseFloat(m[1].replace(',','.')), einheit:(m[2]||'').toLowerCase(), artikel:(m[3]||z).trim() };
  }
  return { menge:null, einheit:'', artikel:z.trim() };
}
/* Sammelt alle Zutaten der Woche zusammengefasst. */
function buildShoppingList(){
  const n = getNutrition();
  const map = {};   // key = artikel+einheit → {menge, einheit, artikel, count}
  WD_CAL.forEach((wd, i) => {
    const choice = n.chosen[dateKeyForWeekday(i)] || 'a';
    const plan = n.week[i][choice];
    Object.values(plan.meals).forEach(rid => {
      if (!rid || !n.recipes[rid]) return;
      (n.recipes[rid].ing || []).forEach(z => {
        const p = parseZutat(z);
        const key = (p.artikel + '|' + p.einheit).toLowerCase();
        if (!map[key]) map[key] = { menge:0, hasMenge:false, einheit:p.einheit, artikel:p.artikel, count:0 };
        map[key].count++;
        if (p.menge != null){ map[key].menge += p.menge; map[key].hasMenge = true; }
      });
    });
  });
  // Nach Lidl-Kategorie gruppieren
  const grouped = {};
  Object.values(map).forEach(item => {
    const kat = lidlKategorie(item.artikel);
    if (!grouped[kat]) grouped[kat] = [];
    grouped[kat].push(item);
  });
  return grouped;
}
function formatShoppingItem(item){
  // Menge hübsch: g→kg ab 1000, ml→l ab 1000
  let mengeStr = '';
  if (item.hasMenge && item.menge > 0){
    let m = item.menge, e = item.einheit;
    if (e === 'g' && m >= 1000){ m = m/1000; e = 'kg'; }
    if (e === 'ml' && m >= 1000){ m = m/1000; e = 'l'; }
    const mClean = Math.round(m*100)/100;
    mengeStr = `${mClean}${e ? ' '+e : ''}`;
  } else if (item.count > 1){
    mengeStr = `${item.count}×`;
  }
  return { artikel: item.artikel, menge: mengeStr };
}

function openShoppingSheet(){
  const grouped = buildShoppingList();
  // Kategorien in sinnvoller Einkaufs-Reihenfolge
  const order = ['Obst & Gemüse','Kühlregal (Molkerei & Eier)','Fleisch & Fisch','Trockenwaren & Vorrat','Sonstiges'];

// Sortierung nach gewählter Methode (Standard: Empfohlen)
const SORT_LABELS = { smart:'Empfohlen', due:'Fälligkeit', prio:'Priorität', effort:'Aufwand', name:'Name', created:'Erstellt' };
const SORT_HINT = 'Überfällig & dringend zuerst, dann nach Priorität und Aufwand';

/* Vergleichswert für ein Kriterium (kleiner = zuerst bei aufsteigend). */
function sortKey(t, crit){
  if (crit === 'due')    return t.due ? new Date(t.due).getTime() : Infinity;
  if (crit === 'prio')   return t.priority || 9;
  if (crit === 'effort') return t.effort ? +t.effort : Infinity;
  if (crit === 'name')   return (t.text||'').toLowerCase();
  if (crit === 'created')return t.createdAt || 0;
  return 0;
}
function cmpBy(crit, dir){
  return (a,b) => {
    let ka = sortKey(a,crit), kb = sortKey(b,crit);
    let r;
    if (typeof ka === 'string') r = ka.localeCompare(kb);
    else r = (ka < kb ? -1 : ka > kb ? 1 : 0);
    return dir === 'desc' ? -r : r;
  };
}
function sortTasks(list){
  const arr = list.slice();
  if (SORT === 'smart'){ arr.sort((a,b) => score(a)-score(b)); return arr; }
  const primary = cmpBy(SORT, SORT_DIR);
  const secondary = (SORT2 !== 'none' && SORT2 !== SORT) ? cmpBy(SORT2, SORT2_DIR) : null;
  arr.sort((a,b) => {
    const r = primary(a,b);
    if (r !== 0) return r;
    if (secondary){ const r2 = secondary(a,b); if (r2 !== 0) return r2; }
    return score(a) - score(b);  // stabiler Fallback
  });
  return arr;
}
// Suchfilter (Text + Kategorie)
function applySearch(list){
  const q = SEARCH.trim().toLowerCase();
  if (!q) return list;
  return list.filter(t =>
    (t.text||'').toLowerCase().includes(q) ||
    (t.category||'').toLowerCase().includes(q) ||
    (t.notes||'').toLowerCase().includes(q)
  );
}
// Umfangreiche Filter (kombinierbar) anwenden
function applyFilters(list){
  let out = list;
  if (FILTER.prio && FILTER.prio.length){
    out = out.filter(t => FILTER.prio.includes(t.priority || 0) || (FILTER.prio.includes(0) && !t.priority));
  }
  if (FILTER.cat && FILTER.cat.length){
    out = out.filter(t => t.category && FILTER.cat.includes(t.category));
  }
  if (FILTER.fav){
    out = out.filter(t => t.fav);
  }
  if (FILTER.due && FILTER.due !== 'any'){
    const today = startOfDay(new Date()).getTime();
    const weekEnd = today + 7*86400000;
    out = out.filter(t => {
      if (FILTER.due === 'nodate') return !t.due;
      if (!t.due) return false;
      const d = startOfDay(new Date(t.due)).getTime();
      if (FILTER.due === 'overdue') return d < today;
      if (FILTER.due === 'today')   return d === today;
      if (FILTER.due === 'week')    return d >= today && d <= weekEnd;
      return true;
    });
  }
  return out;
}
// Sind aktuell Filter aktiv?
function filterCount(){
  let n = 0;
  if (FILTER.prio.length) n += FILTER.prio.length;
  if (FILTER.cat.length) n += FILTER.cat.length;
  if (FILTER.fav) n++;
  if (FILTER.due && FILTER.due !== 'any') n++;
  return n;
}
function resetFilters(){ FILTER = { prio:[], cat:[], due:'any', fav:false }; }
// Alle vorhandenen Kategorien aus Aufgaben sammeln
function allTaskCategories(){
  const set = new Set();
  TASKS.forEach(t => { if (t.category) set.add(t.category); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}

/* ═══════════════ APP-ZUSTAND MERKEN (fühlt sich nativ an) ═══════════════
   Speichert die aktuelle Ansicht + Scrollposition, damit die App nach
   Hintergrund/Inaktivität (v.a. iPhone-PWA) genau dort weitermacht. */
const UI_STATE_KEY = 'donow.uistate';
let _restoringUI = false;   // verhindert Speichern während der Wiederherstellung

function saveUIState(){
  if (_restoringUI) return;
  try {
    const st = {
      VIEW, OV_MODE, AREA_OPEN, AREA_TAB, SPORT_TAB, SPORT_DAY,
      NUTRI_DAY, NOTE_OPEN, AREA_FILTER,
      scrollY: window.scrollY || 0,
      ts: Date.now(),
    };
    localStorage.setItem(UI_STATE_KEY, JSON.stringify(st));
  } catch(e){}
}
function restoreUIState(){
  try {
    const raw = localStorage.getItem(UI_STATE_KEY);
    if (!raw) return false;
    const st = JSON.parse(raw);
    // Nur sinnvolle Werte übernehmen
    if (st.VIEW) VIEW = st.VIEW;
    if (typeof st.OV_MODE === 'string') OV_MODE = st.OV_MODE;
    AREA_OPEN = st.AREA_OPEN || null;
    if (typeof st.AREA_TAB === 'string') AREA_TAB = st.AREA_TAB;
    if (typeof st.SPORT_TAB === 'string') SPORT_TAB = st.SPORT_TAB;
    SPORT_DAY = (st.SPORT_DAY === 0 || st.SPORT_DAY) ? st.SPORT_DAY : null;
    NUTRI_DAY = (st.NUTRI_DAY === 0 || st.NUTRI_DAY) ? st.NUTRI_DAY : null;
    NOTE_OPEN = st.NOTE_OPEN || null;
    AREA_FILTER = st.AREA_FILTER || null;
    return st;
  } catch(e){ return false; }
}
function clearUIState(){ try { localStorage.removeItem(UI_STATE_KEY); } catch(e){} }
